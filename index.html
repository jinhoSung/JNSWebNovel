<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jinos 웹소설</title>
    
    <!-- Tailwind CSS (스타일링 프레임워크) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (UI 라이브러리) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (JSX 변환기) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Markdown Parser (마크다운 지원) -->
    <script src="https://unpkg.com/marked@4.3.0/marked.min.js"></script>

    <!-- Google Fonts (웹 폰트) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        /* [보안 설정] 텍스트 선택, 드래그, 우클릭 메뉴 등 차단 */
        body { 
            margin: 0; 
            padding: 0; 
            touch-action: pan-y; /* 수직 스크롤은 허용하되, 좌우 제스처는 JS로 처리 */
            
            /* 텍스트 선택 방지 (브라우저별 벤더 프리픽스) */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            
            /* 롱터치 컨텍스트 메뉴 방지 */
            -webkit-touch-callout: none;
        }
        
        /* 폰트 패밀리 클래스 정의 */
        .font-sans-kr { font-family: 'Noto Sans KR', sans-serif; }
        .font-serif-kr { font-family: 'Noto Serif KR', serif; }
        .font-dodum-kr { font-family: 'Gowun Dodum', sans-serif; }

        /* 이어보기 모달 등장 애니메이션 */
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }

        /* 설정 토글 스위치 커스텀 스타일 */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #3b82f6;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #3b82f6;
        }

        /* [커스텀 스크롤바 스타일] CSS 변수로 테마 색상 적용 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track, #f1f1f1); 
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb, #888); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover, #555); 
        }
        /* 파이어폭스 호환성 */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
        }

        /* [마크다운(.md) 전용 스타일 보정] */
        .markdown-body { color: inherit; line-height: inherit; }
        .markdown-body h1 { font-size: 1.8em; font-weight: 800; margin: 1.2em 0 0.6em; border-bottom: 2px solid currentColor; padding-bottom: 0.3em; }
        .markdown-body h2 { font-size: 1.5em; font-weight: 700; margin: 1em 0 0.5em; border-bottom: 1px solid currentColor; opacity: 0.9; padding-bottom: 0.2em; }
        .markdown-body h3 { font-size: 1.2em; font-weight: 700; margin: 0.8em 0 0.4em; }
        .markdown-body p { margin-bottom: 1.2em; text-align: justify; }
        /* 마크다운 내부 스타일 강제 적용 */
        .markdown-body em, .markdown-body i { font-style: italic !important; color: inherit; }
        .markdown-body strong, .markdown-body b { font-weight: bold !important; color: inherit; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
        .markdown-body blockquote { border-left: 4px solid #888; padding-left: 1em; opacity: 0.7; font-style: italic; margin: 1.5em 0; }
        .markdown-body hr { border: 0; border-top: 1px solid currentColor; opacity: 0.2; margin: 2em 0; }
        .markdown-body code { background: rgba(0,0,0,0.05); padding: 0.2em 0.4em; border-radius: 3px; font-family: monospace; }
        /* 인라인 HTML 스타일 허용 (색상 등) */
        .markdown-body span { color: inherit; }
        .markdown-body img { max-width: 100%; height: auto; border-radius: 8px; margin: 1em auto; display: block; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, memo } = React;

        // ----------------------------------------------------------------------
        // [사용자 설정 영역: GitHub 저장소 정보]
        // ----------------------------------------------------------------------
        const GITHUB_CONFIG = {
            owner: "jinhoSung",      // GitHub 아이디
            repo: "JNSWebNovel",     // 저장소 이름
            rootPath: "Novels",      // 소설 폴더들이 위치한 경로
            branch: "main",          // 브랜치 이름
        };

        // ----------------------------------------------------------------------
        // [아이콘 컴포넌트] (Lucide React 대체용 SVG)
        // ----------------------------------------------------------------------
        const Icon = ({ path, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );

        const Book = (props) => <Icon {...props} path={<><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></>} />;
        const ChevronLeft = (props) => <Icon {...props} path={<path d="m15 18-6-6 6-6"/>} />;
        const ChevronRight = (props) => <Icon {...props} path={<path d="m9 18 6-6-6-6"/>} />;
        const Menu = (props) => <Icon {...props} path={<><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></>} />;
        const Settings = (props) => <Icon {...props} path={<><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>} />;
        const Type = (props) => <Icon {...props} path={<><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/></>} />;
        const XIcon = (props) => <Icon {...props} path={<><path d="M18 6 6 18"/><path d="m6 6 18 18"/></>} />;
        const HelpCircle = (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></>} />;
        const AlertCircle = (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" i="16" y2="16"/></>} />;
        const Home = (props) => <Icon {...props} path={<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>} />;
        const ImageIcon = (props) => <Icon {...props} path={<><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></>} />;
        const RotateCcw = (props) => <Icon {...props} path={<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></>} />;
        const MousePointerClick = (props) => <Icon {...props} path={<><path d="m9 9 5 12 1.8-5.2L21 14Z"/><path d="M7.2 2.2 8 5.1"/><path d="m5.1 8-2.9-.8"/><path d="M14 4.1 12 6"/><path d="m6 12-1.9 2"/></>} />;
        const Maximize = (props) => <Icon {...props} path={<><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></>} />;
        const Minimize = (props) => <Icon {...props} path={<><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></>} />;

        // ----------------------------------------------------------------------
        // [테마 및 폰트 데이터 정의]
        // ----------------------------------------------------------------------
        const THEMES = {
            light: { 
                id: 'light', name: '라이트', bg: 'bg-white', text: 'text-gray-900', ui: 'bg-gray-50', card: 'bg-white border-gray-200', activeItem: 'bg-blue-100 text-blue-700',
                scrollbarThumb: '#cbd5e1', scrollbarTrack: '#f1f5f9', scrollbarThumbHover: '#94a3b8' 
            },
            sepia: { 
                id: 'sepia', name: '세피아', bg: 'bg-[#f4ecd8]', text: 'text-[#5b4636]', ui: 'bg-[#e9dfc6]', card: 'bg-[#fdf6e3] border-[#d3c5a3]', activeItem: 'bg-[#d3c5a3] text-[#4a3b2a]',
                scrollbarThumb: '#d3c5a3', scrollbarTrack: '#f4ecd8', scrollbarThumbHover: '#a89b80'
            },
            green: { 
                id: 'green', name: '눈보호', bg: 'bg-[#e0f2f1]', text: 'text-[#004d40]', ui: 'bg-[#b2dfdb]', card: 'bg-[#e0f2f1] border-[#80cbc4]', activeItem: 'bg-[#80cbc4] text-[#004d40]',
                scrollbarThumb: '#80cbc4', scrollbarTrack: '#e0f2f1', scrollbarThumbHover: '#4db6ac'
            },
            dark: { 
                id: 'dark', name: '다크', bg: 'bg-[#2a2a2a]', text: 'text-gray-300', ui: 'bg-[#1a1a1a]', card: 'bg-[#333] border-gray-700', activeItem: 'bg-[#404040] text-blue-300',
                scrollbarThumb: '#4b5563', scrollbarTrack: '#2a2a2a', scrollbarThumbHover: '#6b7280'
            },
            black: { 
                id: 'black', name: '블랙', bg: 'bg-black', text: 'text-gray-400', ui: 'bg-[#111]', card: 'bg-[#111] border-gray-800', activeItem: 'bg-[#222] text-white',
                scrollbarThumb: '#333333', scrollbarTrack: '#000000', scrollbarThumbHover: '#555555'
            },
        };

        const FONTS = {
            sans: { name: '고딕(Sans)', class: 'font-sans-kr' },
            serif: { name: '명조(Serif)', class: 'font-serif-kr' },
            dodum: { name: '돋움(Dodum)', class: 'font-dodum-kr' },
        };

        // ----------------------------------------------------------------------
        // [커스텀 훅] LocalStorage 관리 (설정 저장용)
        // ----------------------------------------------------------------------
        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) { return initialValue; }
            });
            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {}
            };
            return [storedValue, setValue];
        }

        // ----------------------------------------------------------------------
        // [최적화] 시계 컴포넌트 분리 (성능 향상을 위해 memo 사용)
        // ----------------------------------------------------------------------
        const CurrentTimeDisplay = memo(() => {
            const [time, setTime] = useState("");

            useEffect(() => {
                const update = () => {
                    const now = new Date();
                    const month = now.getMonth() + 1;
                    const day = now.getDate();
                    const hours = String(now.getHours()).padStart(2, '0');
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    // 요청사항: 1.5배 크기, 월/일 포함
                    setTime(`${month}월 ${day}일 ${hours}:${minutes}`);
                };
                update();
                const timer = setInterval(update, 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                // 폰트 크기 및 굵기 강조 (1.5배 느낌의 text-sm + bold)
                <div className="text-sm font-bold opacity-70 mr-3 min-w-[12ch] text-right hidden sm:block select-none">
                    {time}
                </div>
            );
        });

        // ----------------------------------------------------------------------
        // 메인 애플리케이션 컴포넌트
        // ----------------------------------------------------------------------
        function WebNovelReader() {
            // [상태 관리: 데이터]
            const [view, setView] = useState('list');
            const [novels, setNovels] = useState([]);
            const [currentNovel, setCurrentNovel] = useState(null);
            const [chapters, setChapters] = useState([]);
            const [currentChapterIndex, setCurrentChapterIndex] = useState(0);
            const [content, setContent] = useState("");
            
            // [상태 관리: 로딩/에러]
            const [isLoading, setIsLoading] = useState(false);
            const [isGlobalLoading, setIsGlobalLoading] = useState(true);
            const [errorMsg, setErrorMsg] = useState(null);

            // [상태 관리: UI]
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [desktopSidebarVisible, setDesktopSidebarVisible] = useState(true);
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [helpOpen, setHelpOpen] = useState(false);
            const [isFullScreen, setIsFullScreen] = useState(false);
            
            // [상태 관리: 편의기능]
            const [lastReadData, setLastReadData] = useState(null);
            const [showResumeModal, setShowResumeModal] = useState(false);
            const [scrollProgress, setScrollProgress] = useState(0);

            // [설정 값 (LocalStorage 연동)]
            const [themeKey, setThemeKey] = useLocalStorage('jinos_theme', 'sepia');
            const [fontSize, setFontSize] = useLocalStorage('jinos_fontsize', 18);
            const [lineHeight, setLineHeight] = useLocalStorage('jinos_lineheight', 1.8);
            const [fontFamilyKey, setFontFamilyKey] = useLocalStorage('jinos_font', 'sans');
            const [gestureEnabled, setGestureEnabled] = useLocalStorage('jinos_gesture', true);

            const viewerRef = useRef(null);
            const dragStartRef = useRef({ x: 0, y: 0 });

            const theme = THEMES[themeKey] || THEMES.sepia;
            const font = FONTS[fontFamilyKey] || FONTS.sans;

            // 미리보기 환경 감지
            const isPreviewEnv = window.location.protocol === 'blob:' || window.location.hostname === '';

            // 1. [보안 이벤트 및 전체화면 상태 감지]
            useEffect(() => {
                const preventDefault = (e) => e.preventDefault();

                // 우클릭, 복사, 드래그 등 차단
                document.addEventListener('contextmenu', preventDefault);
                document.addEventListener('copy', preventDefault);
                document.addEventListener('cut', preventDefault);
                document.addEventListener('paste', preventDefault);
                document.addEventListener('dragstart', preventDefault);
                document.addEventListener('selectstart', preventDefault);

                // 개발자 도구 단축키 차단
                const handleKeyDown = (e) => {
                    if (
                        e.key === 'F12' || 
                        (e.ctrlKey && (e.key === 'u' || e.key === 'U')) || 
                        (e.ctrlKey && (e.key === 's' || e.key === 'S')) || 
                        (e.ctrlKey && (e.key === 'p' || e.key === 'P')) || 
                        (e.ctrlKey && e.shiftKey && (e.key === 'i' || e.key === 'I' || e.key === 'c' || e.key === 'C' || e.key === 'j' || e.key === 'J'))
                    ) { e.preventDefault(); }
                };
                document.addEventListener('keydown', handleKeyDown);

                // 전체화면 상태 동기화
                const handleFullScreenChange = () => setIsFullScreen(!!document.fullscreenElement);
                document.addEventListener('fullscreenchange', handleFullScreenChange);

                return () => {
                    document.removeEventListener('contextmenu', preventDefault);
                    document.removeEventListener('copy', preventDefault);
                    document.removeEventListener('cut', preventDefault);
                    document.removeEventListener('paste', preventDefault);
                    document.removeEventListener('dragstart', preventDefault);
                    document.removeEventListener('selectstart', preventDefault);
                    document.removeEventListener('keydown', handleKeyDown);
                    document.removeEventListener('fullscreenchange', handleFullScreenChange);
                };
            }, []);

            // 2. [초기 로드: 소설 목록 + 이어보기 체크]
            useEffect(() => {
                fetchNovelList();
                try {
                    const savedRead = localStorage.getItem('jinos_last_read');
                    if (savedRead) {
                        const parsed = JSON.parse(savedRead);
                        if (parsed && parsed.novelId && parsed.chapterTitle) {
                            setLastReadData(parsed);
                            setShowResumeModal(true);
                        }
                    }
                } catch (e) {}
            }, []);

            // 3. [진행률 및 스크롤 위치 저장]
            // 스크롤이 멈췄을 때 현재 위치를 저장 (디바운싱 없이 간단하게 구현)
            useEffect(() => {
                const handleScroll = () => {
                    if (viewerRef.current) {
                        const { scrollTop, scrollHeight, clientHeight } = viewerRef.current;
                        const totalScroll = scrollHeight - clientHeight;
                        
                        // 진행률 계산
                        if (totalScroll > 0) {
                            const percent = Math.min(100, Math.max(0, Math.round((scrollTop / totalScroll) * 100)));
                            setScrollProgress(percent);
                        } else {
                            setScrollProgress(100);
                        }
                    }
                };

                const viewerElement = viewerRef.current;
                if (viewerElement) {
                    viewerElement.addEventListener('scroll', handleScroll);
                    handleScroll(); // 초기값 설정
                }
                return () => { if (viewerElement) viewerElement.removeEventListener('scroll', handleScroll); };
            }, [content, view]);

            // 챕터가 바뀌거나 뷰어를 떠날 때 현재 상태 저장
            useEffect(() => {
                if (view === 'reader' && currentNovel && chapters.length > 0) {
                    const currentChapter = chapters[currentChapterIndex];
                    if (!currentChapter) return;

                    // 스크롤 비율 계산
                    let scrollRatio = 0;
                    if(viewerRef.current) {
                        const { scrollTop, scrollHeight, clientHeight } = viewerRef.current;
                        if(scrollHeight > clientHeight) {
                            scrollRatio = scrollTop / (scrollHeight - clientHeight);
                        }
                    }

                    const saveData = {
                        novelId: currentNovel.id,
                        novelTitle: currentNovel.title,
                        novelPath: currentNovel.path,
                        chapterIndex: currentChapterIndex,
                        chapterTitle: currentChapter.title,
                        scrollRatio: scrollRatio,
                        timestamp: new Date().getTime()
                    };
                    localStorage.setItem('jinos_last_read', JSON.stringify(saveData));
                }
            }, [currentChapterIndex, view, currentNovel, chapters]); // content가 빠져야 스크롤 변경 시마다 저장되지 않음(성능)

            // 4. [제스처: 더블클릭]
            const handleDoubleClick = (e) => {
                if (!gestureEnabled) return;
                const width = window.innerWidth;
                const clickX = e.clientX;
                if (clickX < width / 2) handlePrev(); else handleNext();
            };

            // 5. [제스처: 드래그/터치]
            const handlePointerDown = (e) => {
                if (!gestureEnabled) return;
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
                else { clientX = e.clientX; clientY = e.clientY; }
                
                if (clientX === undefined) return;
                dragStartRef.current = { x: clientX, y: clientY };
            };

            const handlePointerUp = (e) => {
                if (!gestureEnabled) return;
                // 드래그 중 텍스트 선택이 발생했으면 무시
                if (window.getSelection().toString().length > 0) return;

                let clientX, clientY;
                if (e.changedTouches && e.changedTouches.length > 0) { clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY; }
                else { clientX = e.clientX; clientY = e.clientY; }
                
                if (clientX === undefined) return;

                const diffX = clientX - dragStartRef.current.x;
                const diffY = clientY - dragStartRef.current.y;

                // 세로 스크롤 의도가 더 크면 무시
                if (Math.abs(diffY) > Math.abs(diffX) || Math.abs(diffY) > 30) return;

                // 50px 이상 이동 시 트리거
                if (Math.abs(diffX) > 50) {
                    if (diffX > 0) handlePrev(); else handleNext();
                }
            };

            // 6. [전체화면 토글]
            const toggleFullScreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => console.log(err));
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            };

            // 7. [데이터 로드: 소설 목록]
            const fetchNovelList = async () => {
                setIsGlobalLoading(true);
                setErrorMsg(null);
                if (isPreviewEnv) {
                    // 미리보기용 더미 데이터
                    setTimeout(() => {
                        setNovels([
                            { id: '1', title: "드래곤 라자", path: "Novels/dragon_raja", coverUrl: "https://via.placeholder.com/150/8b4513/ffffff?text=Dragon" },
                            { id: '2', title: "나의 히어로 아카데미아", path: "Novels/hero_aca", coverUrl: "" },
                        ]);
                        setIsGlobalLoading(false);
                    }, 500);
                    return;
                }
                try {
                    const apiUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.rootPath}`;
                    const response = await fetch(apiUrl);
                    if (!response.ok) throw new Error("목록 로드 실패");
                    const data = await response.json();
                    const loadedNovels = data.filter(item => item.type === 'dir').map(folder => ({
                        id: folder.sha,
                        title: decodeURIComponent(folder.name).replace(/[-_]/g, ' '),
                        path: folder.path,
                    }));
                    if (loadedNovels.length === 0) throw new Error("소설 폴더 없음");
                    setNovels(loadedNovels);
                } catch (err) { setErrorMsg(err.message); } finally { setIsGlobalLoading(false); }
            };

            // 8. [데이터 로드: 챕터 목록]
            const selectNovel = async (novel, targetIndex = 0, targetScrollRatio = 0) => {
                setCurrentNovel(novel);
                setView('reader');
                setChapters([]);
                setContent("");
                setIsLoading(true);
                setSidebarOpen(false); 
                setDesktopSidebarVisible(true);
                setScrollProgress(0);

                // 스크롤 복원 목표값 저장
                if(viewerRef.current) viewerRef.current.dataset.restoreScroll = targetScrollRatio;

                if (isPreviewEnv) {
                    setTimeout(() => {
                        const demoChapters = [
                            { id: 1, title: "제1화 - 시작", fileName: "1.시작.txt", downloadUrl: "" },
                            { id: 2, title: "제2화 - 모험 (MD)", fileName: "2.모험.md", downloadUrl: "" },
                        ];
                        setChapters(demoChapters);
                        setCurrentChapterIndex(targetIndex);
                        setIsLoading(false);
                    }, 300);
                    return;
                }
                try {
                    const apiUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${novel.path}`;
                    const response = await fetch(apiUrl);
                    if (!response.ok) throw new Error("챕터 로드 실패");
                    const data = await response.json();
                    
                    const loadedChapters = data.filter(f => f.name.endsWith('.txt') || f.name.endsWith('.md')).map(file => {
                        let rawName = file.name.replace(/\.(txt|md)$/i, '').replace(/\[.*?\]/g, '').trim();
                        const numMatch = rawName.match(/(\d+)/);
                        const chapterNum = numMatch ? parseInt(numMatch[0]) : 0;
                        let chapterTitle = numMatch ? rawName.replace(numMatch[0], '').replace(/^[.\s_\[\]\(\)화장제-]+|[.\s_\[\]\(\)화장제-]+$/g, '').trim() : rawName;
                        if (!chapterTitle) chapterTitle = rawName.replace(chapterNum, '').trim() || "제목 없음";
                        return { id: chapterNum, title: `제${chapterNum}화 - ${chapterTitle}`, downloadUrl: file.download_url, fileName: file.name };
                    }).sort((a, b) => a.id - b.id);

                    setChapters(loadedChapters);
                    if (targetIndex >= 0 && targetIndex < loadedChapters.length) setCurrentChapterIndex(targetIndex);
                    else setCurrentChapterIndex(0);
                } catch (error) { alert("오류: " + error.message); } finally { setIsLoading(false); }
            };

            // 9. [이어보기 처리]
            const handleResume = () => {
                setShowResumeModal(false);
                if (lastReadData) {
                    selectNovel(
                        { id: lastReadData.novelId, title: lastReadData.novelTitle, path: lastReadData.novelPath }, 
                        lastReadData.chapterIndex,
                        lastReadData.scrollRatio || 0
                    );
                }
            };

            // 10. [데이터 로드: 챕터 본문]
            const fetchChapterContent = async () => {
                if (view !== 'reader' || !chapters[currentChapterIndex]) return;
                setIsLoading(true);
                const chapter = chapters[currentChapterIndex];
                try {
                    if (isPreviewEnv) {
                        await new Promise(resolve => setTimeout(resolve, 300));
                        setContent(chapter.fileName.endsWith('.md') 
                            ? "# 마크다운 예시\n\n- 이 파일은 **마크다운**입니다.\n- *기울임* 및 <span style='color:red'>색상</span> 지원.\n\n본문 내용..."
                            : "일반 텍스트 소설 본문입니다.");
                    } else {
                        const response = await fetch(chapter.downloadUrl);
                        if (!response.ok) throw new Error("내용 로드 실패");
                        const text = await response.text();
                        setContent(text);
                    }
                } catch (error) { setContent("내용을 불러오는데 실패했습니다."); } finally {
                    setIsLoading(false);
                    
                    // 스크롤 복구 로직 (렌더링 직후 실행)
                    setTimeout(() => {
                        if (viewerRef.current) {
                            const restoreRatio = parseFloat(viewerRef.current.dataset.restoreScroll || 0);
                            if (restoreRatio > 0) {
                                const { scrollHeight, clientHeight } = viewerRef.current;
                                viewerRef.current.scrollTop = (scrollHeight - clientHeight) * restoreRatio;
                                viewerRef.current.dataset.restoreScroll = 0; // 초기화
                            } else {
                                viewerRef.current.scrollTop = 0;
                            }
                        }
                    }, 100);

                    setScrollProgress(0);
                    if (window.innerWidth < 768) setSidebarOpen(false);
                }
            };

            useEffect(() => {
                fetchChapterContent();
            }, [currentChapterIndex, chapters, view]);

            // 네비게이션
            const handlePrev = () => { if (currentChapterIndex > 0) setCurrentChapterIndex(prev => prev - 1); };
            const handleNext = () => { if (currentChapterIndex < chapters.length - 1) setCurrentChapterIndex(prev => prev + 1); };
            const toggleSidebar = () => {
                if (window.innerWidth >= 768) setDesktopSidebarVisible(!desktopSidebarVisible);
                else setSidebarOpen(!sidebarOpen);
            };

            // 11. [렌더러] 마크다운/텍스트 분기 처리
            const renderNovelBody = () => {
                const isMD = chapters[currentChapterIndex]?.fileName.endsWith('.md');
                // marked 라이브러리가 로드되었는지 확인
                if (isMD && window.marked) {
                    try {
                        return <div className="markdown-body" dangerouslySetInnerHTML={{ __html: window.marked.parse(content) }} />;
                    } catch (e) {
                        return <div className="prose whitespace-pre-wrap">{content}</div>;
                    }
                }
                return <div className="prose whitespace-pre-wrap">{content}</div>;
            };

            // --------------------------------------------------------------------------------
            // [UI 컴포넌트 렌더링]
            // --------------------------------------------------------------------------------
            
            // 에러 화면
            if (errorMsg) return (
                <div className={`flex h-screen flex-col items-center justify-center p-4 ${theme.bg} ${theme.text} ${font.class}`}>
                    <div className="max-w-md w-full p-6 border border-red-300 rounded-lg bg-red-50 text-red-700 shadow-lg text-center">
                        <p className="mb-4 text-sm font-bold">{errorMsg}</p>
                        <button onClick={() => window.location.reload()} className="px-6 py-2 bg-red-600 text-white rounded">새로고침</button>
                    </div>
                </div>
            );

            // 로딩 화면
            if (isGlobalLoading) return (
                <div className={`flex h-screen items-center justify-center ${theme.bg} ${theme.text} ${font.class}`}>
                    <div className="text-center">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-current mx-auto mb-4 opacity-50"></div>
                        <p>서재를 불러오는 중...</p>
                    </div>
                </div>
            );

            // 메인 화면
            return (
                <div 
                    className={`flex h-screen overflow-hidden ${theme.bg} ${theme.text} ${font.class} transition-colors duration-300`}
                    style={{ '--scrollbar-thumb': theme.scrollbarThumb, '--scrollbar-track': theme.scrollbarTrack, '--scrollbar-thumb-hover': theme.scrollbarThumbHover }}
                >
                    
                    {/* 이어보기 모달 */}
                    {showResumeModal && lastReadData && view === 'list' && (
                        <div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/40" onClick={() => setShowResumeModal(false)}></div>
                            <div className={`relative w-full sm:w-auto sm:max-w-md sm:rounded-2xl rounded-t-2xl shadow-2xl p-6 animate-slide-up ${theme.bg} ${theme.text} border-t sm:border border-gray-500/20`}>
                                <div className="flex items-start gap-4">
                                    <div className="p-3 rounded-full bg-blue-100 text-blue-600 shrink-0"><RotateCcw size={24} /></div>
                                    <div className="flex-1">
                                        <h3 className="text-lg font-bold mb-1">이어보시겠습니까?</h3>
                                        <p className="text-sm opacity-80 mb-3">{lastReadData.novelTitle} - {lastReadData.chapterTitle}</p>
                                        <div className="flex gap-3">
                                            <button onClick={() => setShowResumeModal(false)} className="flex-1 py-3 rounded-lg font-medium text-sm bg-black/5 hover:bg-black/10 text-current">아니오</button>
                                            <button onClick={handleResume} className="flex-1 py-3 rounded-lg font-bold text-sm bg-blue-600 text-white hover:bg-blue-700 shadow-lg shadow-blue-500/30">네, 이어볼게요</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 사이드바 (회차 목록) */}
                    {view === 'reader' && (
                        <>
                            {sidebarOpen && <div className="fixed inset-0 bg-black/50 z-40 md:hidden" onClick={() => setSidebarOpen(false)}></div>}
                            <div className={`fixed md:relative inset-y-0 left-0 z-50 w-72 flex flex-col border-r shadow-xl md:shadow-none transition-all duration-300 ease-in-out ${theme.ui} ${theme.text} border-gray-500/20 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} ${desktopSidebarVisible ? 'md:translate-x-0 md:w-72' : 'md:w-0 md:overflow-hidden md:border-r-0'}`}>
                                <div className="p-4 border-b border-gray-500/20 flex justify-between items-center h-16 shrink-0 font-bold">
                                    <h2 className="text-lg flex items-center gap-2 truncate pr-2"><Book size={20} /><span className="truncate">{currentNovel?.title}</span></h2>
                                    <button onClick={() => setSidebarOpen(false)} className="md:hidden p-1 rounded hover:bg-black/10"><XIcon size={20} /></button>
                                </div>
                                <div className="p-2 border-b border-gray-500/20 shrink-0">
                                    <button onClick={() => setView('list')} className="w-full flex items-center gap-2 p-2 rounded hover:bg-black/5 text-sm font-bold opacity-70"><Home size={16} /> 서재로 돌아가기</button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-2 w-full">
                                    {chapters.map((chapter, idx) => (
                                        <button key={idx} onClick={() => setCurrentChapterIndex(idx)} className={`w-full text-left p-3 rounded-lg mb-1 transition-colors text-sm ${currentChapterIndex === idx ? theme.activeItem : 'hover:bg-black/5 opacity-80 hover:opacity-100'}`}>
                                            <span className="text-xs opacity-60 block mb-0.5">#{idx + 1}</span>
                                            <span className="block font-medium truncate">{chapter.title}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </>
                    )}

                    {/* 메인 콘텐츠 영역 */}
                    <div className="flex-1 flex flex-col h-full relative min-w-0">
                        {/* 헤더 */}
                        <header className={`h-16 flex items-center justify-between px-4 border-b border-black/10 sticky top-0 z-20 ${theme.ui}`}>
                            <div className="flex items-center gap-3 overflow-hidden">
                                {view === 'reader' && <button onClick={toggleSidebar} className="p-2 rounded hover:bg-black/10 shrink-0"><Menu size={20} /></button>}
                                <h1 className="font-bold text-lg truncate">
                                    {view === 'list' ? 'Jinos 웹소설' : <span className="flex flex-col md:block"><span className="md:hidden text-xs opacity-70">{currentNovel?.title}</span><span>{chapters[currentChapterIndex]?.title || currentNovel?.title}</span></span>}
                                </h1>
                            </div>
                            <div className="flex items-center gap-1 shrink-0">
                                {/* 시계 (분리된 컴포넌트) */}
                                <CurrentTimeDisplay />

                                {view === 'reader' && <div className="text-xs font-mono opacity-50 mr-2 min-w-[3ch] text-right">{scrollProgress}%</div>}
                                
                                <button onClick={toggleFullScreen} className="p-2 rounded-full hover:bg-black/5 text-gray-500 transition-colors" title={isFullScreen ? "전체화면 종료" : "전체화면"}>
                                    {isFullScreen ? <Minimize size={20} /> : <Maximize size={20} />}
                                </button>

                                {view === 'list' && <button onClick={() => setHelpOpen(true)} className="p-2 rounded-full hover:bg-black/5 text-gray-500"><HelpCircle size={20} /></button>}
                                <button onClick={() => setSettingsOpen(!settingsOpen)} className={`p-2 rounded-full transition-colors ${settingsOpen ? 'bg-black/10' : 'hover:bg-black/5'}`}><Settings size={20} /></button>
                            </div>

                            {/* 설정 팝업 패널 */}
                            {settingsOpen && (
                                <div className={`absolute top-16 right-2 w-80 max-w-[95vw] p-5 rounded-xl shadow-2xl border ${theme.card} z-50 text-sm`}>
                                    <div className="space-y-5">
                                        {/* 테마 */}
                                        <div>
                                            <label className="text-xs font-bold opacity-60 mb-2 block uppercase">테마</label>
                                            <div className="grid grid-cols-5 gap-1 bg-black/5 p-1 rounded-lg">
                                                {Object.values(THEMES).map((t) => (
                                                    <button key={t.id} onClick={() => setThemeKey(t.id)} className={`h-8 rounded flex items-center justify-center ${themeKey === t.id ? 'ring-2 ring-blue-500 ring-offset-1' : 'hover:opacity-80'}`} style={{ backgroundColor: t.id === 'black' ? '#000' : (t.id === 'sepia' ? '#f4ecd8' : (t.id === 'green' ? '#e0f2f1' : '#fff')) }}>
                                                        {themeKey === t.id && <div className="w-1.5 h-1.5 rounded-full bg-blue-500"></div>}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                        {/* 폰트 */}
                                        <div>
                                            <label className="text-xs font-bold opacity-60 mb-2 block uppercase">폰트 종류</label>
                                            <div className="grid grid-cols-3 gap-2">
                                                {Object.entries(FONTS).map(([key, f]) => (
                                                    <button key={key} onClick={() => setFontFamilyKey(key)} className={`py-2 px-1 rounded border text-xs ${fontFamilyKey === key ? 'border-blue-500 bg-blue-50 text-blue-700 font-bold' : 'border-gray-300 opacity-70 hover:opacity-100'}`}>{f.name.split('(')[0]}</button>
                                                ))}
                                            </div>
                                        </div>
                                        {/* 글자 크기 */}
                                        <div>
                                            <label className="text-xs font-bold opacity-60 mb-2 block uppercase flex justify-between"><span>글자 크기</span><span>{fontSize}px</span></label>
                                            <input type="range" min="12" max="32" step="1" value={fontSize} onChange={(e) => setFontSize(Number(e.target.value))} className="w-full accent-blue-500 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" />
                                        </div>
                                        {/* 줄 간격 */}
                                        <div>
                                            <label className="text-xs font-bold opacity-60 mb-2 block uppercase">줄 간격</label>
                                            <div className="flex gap-2 bg-black/5 p-1 rounded-lg">
                                                {[1.4, 1.6, 1.8, 2.0, 2.4].map((lh) => (
                                                    <button key={lh} onClick={() => setLineHeight(lh)} className={`flex-1 py-1 rounded text-xs ${lineHeight === lh ? 'bg-white shadow text-black font-bold' : 'hover:bg-black/5 opacity-60'}`}>{lh}</button>
                                                ))}
                                            </div>
                                        </div>
                                        {/* 제스처 토글 */}
                                        <div className="pt-2 border-t border-gray-500/20">
                                            <div className="flex items-center justify-between">
                                                <div className="flex items-center gap-2">
                                                    <MousePointerClick size={16} className="opacity-60" />
                                                    <span className="font-bold opacity-80">제스처/더블클릭 이동</span>
                                                </div>
                                                <div className="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                                                    <input type="checkbox" name="toggle" id="gesture-toggle" className="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer" checked={gestureEnabled} onChange={(e) => setGestureEnabled(e.target.checked)}/>
                                                    <label htmlFor="gesture-toggle" className={`toggle-label block overflow-hidden h-5 rounded-full cursor-pointer ${gestureEnabled ? 'bg-blue-500' : 'bg-gray-300'}`}></label>
                                                </div>
                                            </div>
                                            <p className="text-[10px] opacity-50 mt-1 pl-6">왼쪽/오른쪽 더블클릭 또는 드래그로 이전/다음 화 이동</p>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </header>

                        {/* 메인 뷰 */}
                        <main 
                            ref={viewerRef} 
                            className="flex-1 overflow-y-auto relative scroll-smooth no-scrollbar"
                            onDoubleClick={handleDoubleClick}
                            onMouseDown={handlePointerDown}
                            onMouseUp={handlePointerUp}
                            onTouchStart={handlePointerDown}
                            onTouchEnd={handlePointerUp}
                        >
                            {/* 리스트 뷰 */}
                            {view === 'list' && (
                                <div className="max-w-6xl mx-auto p-4 md:p-8">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {novels.map((novel) => (
                                            <button key={novel.id} onClick={() => selectNovel(novel)} className={`group flex flex-col text-left rounded-xl overflow-hidden shadow-sm hover:shadow-xl transition-all transform hover:-translate-y-1 border ${theme.card}`}>
                                                <div className={`h-48 w-full ${themeKey === 'black' ? 'bg-gray-900' : 'bg-gray-200'} relative overflow-hidden flex items-center justify-center`}>
                                                    <img 
                                                        src={`./${encodeURI(novel.path)}/cover.jpg`} 
                                                        alt={novel.title}
                                                        className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                                                        onError={(e) => {
                                                            const target = e.target;
                                                            const basePath = `./${encodeURI(novel.path)}/`;
                                                            if (target.src.match(/\.jpg$/i)) { target.src = `${basePath}cover.png`; }
                                                            else if (target.src.match(/\.png$/i)) { target.src = `${basePath}cover.jpeg`; }
                                                            else { target.style.display = 'none'; target.nextElementSibling.style.display = 'flex'; }
                                                        }}
                                                    />
                                                    <div className={`hidden absolute inset-0 items-center justify-center ${themeKey === 'black' ? 'text-gray-700' : 'text-gray-400'}`}><ImageIcon size={48} /></div>
                                                </div>
                                                <div className="p-4 flex-1 flex flex-col justify-center">
                                                    <h3 className="font-bold text-lg mb-2 line-clamp-2">{novel.title}</h3>
                                                    <span className="text-sm opacity-60 flex items-center gap-1"><Book size={14} /> 소설 읽기</span>
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* 리더 뷰 */}
                            {view === 'reader' && (
                                <div className="max-w-3xl mx-auto px-5 py-8 md:py-16 min-h-full flex flex-col">
                                    <div className="mb-10 pb-6 border-b border-black/10 text-center">
                                        <span className="text-xs font-bold opacity-50 mb-2 block uppercase tracking-wider">Episode {chapters.length > 0 && chapters[currentChapterIndex]?.id}</span>
                                        <h2 className="text-2xl md:text-3xl font-bold leading-tight">{chapters.length > 0 && chapters[currentChapterIndex]?.title}</h2>
                                    </div>
                                    
                                    {isLoading ? (
                                        <div className="flex-1 flex justify-center items-center py-20"><div className="animate-spin rounded-full h-10 w-10 border-b-2 border-current opacity-30"></div></div>
                                    ) : (
                                        <div 
                                            className="outline-none" 
                                            style={{ fontSize: `${fontSize}px`, lineHeight: lineHeight }}
                                        >
                                            {renderNovelBody()}
                                        </div>
                                    )}
                                    
                                    <div className="mt-20 pt-8 border-t border-black/10 flex justify-between items-center select-none">
                                        <button onClick={handlePrev} disabled={currentChapterIndex === 0} className={`flex items-center gap-2 px-4 py-3 rounded-lg transition-colors ${currentChapterIndex === 0 ? 'opacity-30 cursor-not-allowed' : 'hover:bg-black/5 active:bg-black/10'}`}><ChevronLeft size={20} /><span className="hidden sm:inline font-medium">이전 화</span></button>
                                        <span className="text-sm opacity-60 font-mono">{currentChapterIndex + 1} / {chapters.length}</span>
                                        <button onClick={handleNext} disabled={currentChapterIndex === chapters.length - 1} className={`flex items-center gap-2 px-4 py-3 rounded-lg transition-colors ${currentChapterIndex === chapters.length - 1 ? 'opacity-30 cursor-not-allowed' : 'hover:bg-black/5 active:bg-black/10'}`}><span className="hidden sm:inline font-medium">다음 화</span><ChevronRight size={20} /></button>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>

                    {/* 도움말 모달 */}
                    {helpOpen && (
                        <div className="fixed inset-0 z-[80] flex items-center justify-center bg-black/50 p-4" onClick={() => setHelpOpen(false)}>
                            <div className={`max-w-md w-full p-6 rounded-xl shadow-2xl relative ${theme.bg} ${theme.text}`} onClick={e => e.stopPropagation()}>
                                <button onClick={() => setHelpOpen(false)} className="absolute top-4 right-4 opacity-50 hover:opacity-100"><XIcon size={24} /></button>
                                <h3 className="text-xl font-bold mb-4">Jinos 웹소설 가이드</h3>
                                <div className="space-y-4 text-sm opacity-80 leading-relaxed">
                                    <p>GitHub Repository에 소설 파일을 올리면 자동으로 이곳에 표시됩니다.</p>
                                    <ul className="list-disc pl-5 space-y-2">
                                        <li><strong>지원 형식:</strong> .txt 및 .md (마크다운) 지원</li>
                                        <li><strong>보안:</strong> 텍스트 무단 복제 및 드래그 방지</li>
                                        <li><strong>제스처:</strong> 화면 좌우 더블클릭 또는 좌우 드래그로 회차 이동</li>
                                        <li><strong>이미지:</strong> 폴더별 cover.jpg 또는 cover.png 지원</li>
                                    </ul>
                                </div>
                                <div className="mt-6 text-center"><button onClick={() => setHelpOpen(false)} className="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-bold">확인했습니다</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // 애플리케이션 시작
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WebNovelReader />);
    </script>
</body>
</html>
