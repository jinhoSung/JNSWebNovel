<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jinos 웹소설</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (JSX 컴파일러) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; padding: 0; touch-action: pan-y; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .font-sans-kr { font-family: 'Noto Sans KR', sans-serif; }
        .font-serif-kr { font-family: 'Noto Serif KR', serif; }
        .font-dodum-kr { font-family: 'Gowun Dodum', sans-serif; }

        /* 이어보기 모달 애니메이션 */
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ----------------------------------------------------------------------
        // [사용자 설정 영역]
        // ----------------------------------------------------------------------
        const GITHUB_CONFIG = {
            owner: "jinhoSung",
            repo: "JNSWebNovel",
            rootPath: "Novels",
            branch: "main",
        };

        // ----------------------------------------------------------------------
        // 아이콘 컴포넌트
        // ----------------------------------------------------------------------
        const Icon = ({ path, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );

        const Book = (props) => <Icon {...props} path={<><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></>} />;
        const ChevronLeft = (props) => <Icon {...props} path={<path d="m15 18-6-6 6-6"/>} />;
        const ChevronRight = (props) => <Icon {...props} path={<path d="m9 18 6-6-6-6"/>} />;
        const Menu = (props) => <Icon {...props} path={<><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></>} />;
        const Settings = (props) => <Icon {...props} path={<><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>} />;
        const Type = (props) => <Icon {...props} path={<><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/></>} />;
        const XIcon = (props) => <Icon {...props} path={<><path d="M18 6 6 18"/><path d="m6 6 18 18"/></>} />;
        const HelpCircle = (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></>} />;
        const AlertCircle = (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></>} />;
        const Home = (props) => <Icon {...props} path={<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>} />;
        const ImageIcon = (props) => <Icon {...props} path={<><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></>} />;
        const RotateCcw = (props) => <Icon {...props} path={<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></>} />;

        // 테마 설정
        const THEMES = {
            light: { id: 'light', name: '라이트', bg: 'bg-white', text: 'text-gray-900', ui: 'bg-gray-50', card: 'bg-white border-gray-200', activeItem: 'bg-blue-100 text-blue-700' },
            sepia: { id: 'sepia', name: '세피아', bg: 'bg-[#f4ecd8]', text: 'text-[#5b4636]', ui: 'bg-[#e9dfc6]', card: 'bg-[#fdf6e3] border-[#d3c5a3]', activeItem: 'bg-[#d3c5a3] text-[#4a3b2a]' },
            green: { id: 'green', name: '눈보호', bg: 'bg-[#e0f2f1]', text: 'text-[#004d40]', ui: 'bg-[#b2dfdb]', card: 'bg-[#e0f2f1] border-[#80cbc4]', activeItem: 'bg-[#80cbc4] text-[#004d40]' },
            dark: { id: 'dark', name: '다크', bg: 'bg-[#2a2a2a]', text: 'text-gray-300', ui: 'bg-[#1a1a1a]', card: 'bg-[#333] border-gray-700', activeItem: 'bg-[#404040] text-blue-300' },
            black: { id: 'black', name: '블랙', bg: 'bg-black', text: 'text-gray-400', ui: 'bg-[#111]', card: 'bg-[#111] border-gray-800', activeItem: 'bg-[#222] text-white' },
        };

        // 폰트 설정
        const FONTS = {
            sans: { name: '고딕(Sans)', class: 'font-sans-kr' },
            serif: { name: '명조(Serif)', class: 'font-serif-kr' },
            dodum: { name: '돋움(Dodum)', class: 'font-dodum-kr' },
        };

        // 로컬 스토리지 훅
        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.log(error);
                    return initialValue;
                }
            });

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.log(error);
                }
            };

            return [storedValue, setValue];
        }

        function WebNovelReader() {
            // 상태 관리
            const [view, setView] = useState('list');
            const [novels, setNovels] = useState([]);
            const [currentNovel, setCurrentNovel] = useState(null);
            const [chapters, setChapters] = useState([]);
            const [currentChapterIndex, setCurrentChapterIndex] = useState(0);
            const [content, setContent] = useState("");
            
            const [isLoading, setIsLoading] = useState(false);
            const [isGlobalLoading, setIsGlobalLoading] = useState(true);
            const [errorMsg, setErrorMsg] = useState(null);

            // UI 상태
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [desktopSidebarVisible, setDesktopSidebarVisible] = useState(true);
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [helpOpen, setHelpOpen] = useState(false);
            
            // 이어보기 및 진행률 상태
            const [lastReadData, setLastReadData] = useState(null);
            const [showResumeModal, setShowResumeModal] = useState(false);
            const [scrollProgress, setScrollProgress] = useState(0); // 읽기 진행률 (%)

            // 설정 상태
            const [themeKey, setThemeKey] = useLocalStorage('jinos_theme', 'sepia');
            const [fontSize, setFontSize] = useLocalStorage('jinos_fontsize', 18);
            const [lineHeight, setLineHeight] = useLocalStorage('jinos_lineheight', 1.8);
            const [fontFamilyKey, setFontFamilyKey] = useLocalStorage('jinos_font', 'sans');

            const viewerRef = useRef(null);
            const theme = THEMES[themeKey] || THEMES.sepia;
            const font = FONTS[fontFamilyKey] || FONTS.sans;

            const isPreviewEnv = window.location.protocol === 'blob:' || window.location.hostname === '';

            // 1. 초기 로드 (소설 목록 + 마지막 읽은 기록 확인)
            useEffect(() => {
                fetchNovelList();
                
                // 마지막 읽은 기록 확인
                try {
                    const savedRead = localStorage.getItem('jinos_last_read');
                    if (savedRead) {
                        const parsed = JSON.parse(savedRead);
                        // 유효성 검사 (필수 데이터가 있는지)
                        if (parsed && parsed.novelId && parsed.chapterTitle) {
                            setLastReadData(parsed);
                            setShowResumeModal(true);
                        }
                    }
                } catch (e) {
                    console.error("기록 불러오기 실패", e);
                }
            }, []);

            // 2. 소설 읽는 중 자동 저장 (진행 상황) 및 스크롤 감지 설정
            useEffect(() => {
                if (view === 'reader' && currentNovel && chapters.length > 0) {
                    const currentChapter = chapters[currentChapterIndex];
                    if (!currentChapter) return;

                    const saveData = {
                        novelId: currentNovel.id,
                        novelTitle: currentNovel.title,
                        novelPath: currentNovel.path,
                        chapterIndex: currentChapterIndex,
                        chapterTitle: currentChapter.title,
                        timestamp: new Date().getTime()
                    };
                    
                    localStorage.setItem('jinos_last_read', JSON.stringify(saveData));
                }
            }, [currentChapterIndex, view, currentNovel, chapters]);

            // 스크롤 이벤트 리스너 (진행률 계산)
            useEffect(() => {
                const handleScroll = () => {
                    if (viewerRef.current) {
                        const { scrollTop, scrollHeight, clientHeight } = viewerRef.current;
                        const totalScroll = scrollHeight - clientHeight;
                        if (totalScroll > 0) {
                            const percent = Math.min(100, Math.max(0, Math.round((scrollTop / totalScroll) * 100)));
                            setScrollProgress(percent);
                        } else {
                            setScrollProgress(100); // 스크롤할 게 없으면 100%
                        }
                    }
                };

                const viewerElement = viewerRef.current;
                if (viewerElement) {
                    viewerElement.addEventListener('scroll', handleScroll);
                    // 초기 로드 시에도 한 번 계산
                    handleScroll();
                }

                return () => {
                    if (viewerElement) {
                        viewerElement.removeEventListener('scroll', handleScroll);
                    }
                };
            }, [content, view]); // content가 바뀌거나 view가 바뀌면 리스너 재설정

            // 소설 목록 가져오기 함수
            const fetchNovelList = async () => {
                setIsGlobalLoading(true);
                setErrorMsg(null);

                if (isPreviewEnv) {
                    setTimeout(() => {
                        setNovels([
                            { id: '1', title: "드래곤 라자", path: "Novels/dragon_raja", coverUrl: "https://via.placeholder.com/150/8b4513/ffffff?text=Dragon" },
                            { id: '2', title: "나의 히어로 아카데미아", path: "Novels/hero_aca", coverUrl: "" },
                        ]);
                        setIsGlobalLoading(false);
                    }, 500);
                    return;
                }

                try {
                    const apiUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.rootPath}`;
                    const response = await fetch(apiUrl);
                    
                    if (!response.ok) {
                        if (response.status === 404) throw new Error(`'${GITHUB_CONFIG.rootPath}' 폴더를 찾을 수 없습니다.`);
                        throw new Error(`목록 로드 실패 (${response.status})`);
                    }

                    const data = await response.json();
                    if (!Array.isArray(data)) throw new Error("응답 형식이 올바르지 않습니다.");

                    const loadedNovels = data
                        .filter((item) => item.type === 'dir')
                        .map((folder) => ({
                            id: folder.sha,
                            title: decodeURIComponent(folder.name).replace(/[-_]/g, ' '),
                            path: folder.path,
                        }));

                    if (loadedNovels.length === 0) throw new Error("소설 폴더가 없습니다.");
                    setNovels(loadedNovels);
                } catch (err) {
                    console.error(err);
                    setErrorMsg(err.message);
                } finally {
                    setIsGlobalLoading(false);
                }
            };

            // 소설 선택 및 로드 (targetIndex가 있으면 해당 화로 바로 이동)
            const selectNovel = async (novel, targetIndex = 0) => {
                setCurrentNovel(novel);
                setView('reader');
                setChapters([]);
                setContent("");
                setIsLoading(true);
                setSidebarOpen(false); 
                setDesktopSidebarVisible(true);
                setScrollProgress(0); // 소설 변경 시 진행률 초기화

                if (isPreviewEnv) {
                    setTimeout(() => {
                        const demoChapters = [
                            { id: 1, title: "제1화 - 시작", fileName: "1.시작.txt", downloadUrl: "" },
                            { id: 2, title: "제2화 - 모험", fileName: "2.모험.txt", downloadUrl: "" },
                        ];
                        setChapters(demoChapters);
                        setCurrentChapterIndex(targetIndex);
                        setIsLoading(false);
                    }, 300);
                    return;
                }

                try {
                    const apiUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${novel.path}`;
                    const response = await fetch(apiUrl);
                    if (!response.ok) throw new Error("챕터 목록 로드 실패");

                    const data = await response.json();
                    
                    const loadedChapters = data
                        .filter((file) => file.name.endsWith('.txt'))
                        .map((file) => {
                            // [수정된 파일명 파싱 로직]
                            // 1. 확장자 제거
                            let rawName = file.name.replace(/\.txt$/i, ''); 

                            // 2. 대괄호 태그 제거 (예: [TXT-001])
                            rawName = rawName.replace(/\[.*?\]/g, '').trim();

                            // 3. 숫자 추출 (가장 먼저 나오는 숫자)
                            const numMatch = rawName.match(/(\d+)/);
                            const chapterNum = numMatch ? parseInt(numMatch[0]) : 0;
                            
                            // 4. 제목 추출 (숫자 제거 및 앞뒤 구분자 제거)
                            let chapterTitle = rawName;
                            if (numMatch) {
                                chapterTitle = chapterTitle.replace(numMatch[0], '')
                                    .replace(/^[.\s_\[\]\(\)화장제-]+|[.\s_\[\]\(\)화장제-]+$/g, '') 
                                    .trim();
                            }

                            // 5. 제목이 비어있거나 이상하면 정리
                            if (!chapterTitle) {
                                chapterTitle = rawName.replace(chapterNum, '').trim();
                                if(!chapterTitle) chapterTitle = "제목 없음";
                            }
                            
                            return {
                                id: chapterNum,
                                title: `제${chapterNum}화 - ${chapterTitle}`,
                                downloadUrl: file.download_url,
                                fileName: file.name
                            };
                        })
                        .sort((a, b) => a.id - b.id);

                    setChapters(loadedChapters);
                    
                    // 이어보기 인덱스가 유효한지 확인 후 이동, 아니면 0
                    if (targetIndex >= 0 && targetIndex < loadedChapters.length) {
                        setCurrentChapterIndex(targetIndex);
                    } else {
                        setCurrentChapterIndex(0);
                    }
                } catch (error) {
                    alert("오류 발생: " + error.message);
                } finally {
                    setIsLoading(false);
                }
            };

            // 이어보기 실행 함수
            const handleResume = () => {
                setShowResumeModal(false);
                if (lastReadData) {
                    // 저장된 정보로 소설 객체 재구성
                    const novelObj = {
                        id: lastReadData.novelId,
                        title: lastReadData.novelTitle,
                        path: lastReadData.novelPath
                    };
                    selectNovel(novelObj, lastReadData.chapterIndex);
                }
            };

            // 챕터 내용 로드
            useEffect(() => {
                const fetchChapterContent = async () => {
                    if (view !== 'reader' || chapters.length === 0) return;

                    setIsLoading(true);
                    const chapter = chapters[currentChapterIndex];

                    try {
                        if (isPreviewEnv) {
                            await new Promise(resolve => setTimeout(resolve, 300));
                            setContent(`[시스템] 미리보기 모드입니다.\n\n선택된 소설: ${currentNovel?.title}\n선택된 챕터: ${chapter.title}\n\n설정이 완료되면 실제 내용이 표시됩니다.`);
                        } else {
                            const response = await fetch(chapter.downloadUrl);
                            if (!response.ok) throw new Error("내용 로드 실패");
                            const text = await response.text();
                            setContent(text);
                        }
                    } catch (error) {
                        setContent("내용을 불러오는데 실패했습니다.");
                    } finally {
                        setIsLoading(false);
                        setScrollProgress(0); // 챕터 변경 시 진행률 초기화
                        if (viewerRef.current) viewerRef.current.scrollTop = 0;
                        if (window.innerWidth < 768) setSidebarOpen(false);
                    }
                };
                fetchChapterContent();
            }, [currentChapterIndex, chapters, view]);

            const handlePrev = () => { if (currentChapterIndex > 0) setCurrentChapterIndex(prev => prev - 1); };
            const handleNext = () => { if (currentChapterIndex < chapters.length - 1) setCurrentChapterIndex(prev => prev + 1); };
            const toggleSidebar = () => {
                if (window.innerWidth >= 768) {
                    setDesktopSidebarVisible(!desktopSidebarVisible);
                } else {
                    setSidebarOpen(!sidebarOpen);
                }
            };

            // 에러 화면
            if (errorMsg) return (
                <div className={`flex h-screen flex-col items-center justify-center p-4 ${theme.bg} ${theme.text} ${font.class}`}>
                    <div className="max-w-md w-full p-6 border border-red-300 rounded-lg bg-red-50 text-red-700 shadow-lg">
                        <h3 className="font-bold text-lg mb-2 flex items-center gap-2"><AlertCircle className="text-red-600" /> 설정 오류</h3>
                        <p className="mb-4 text-sm">{errorMsg}</p>
                        <button onClick={() => window.location.reload()} className="w-full py-2 bg-red-600 text-white rounded">새로고침</button>
                    </div>
                </div>
            );

            // 로딩 화면
            if (isGlobalLoading) return (
                <div className={`flex h-screen items-center justify-center ${theme.bg} ${theme.text} ${font.class}`}>
                    <div className="text-center">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-current mx-auto mb-4 opacity-50"></div>
                        <p>서재를 불러오는 중...</p>
                    </div>
                </div>
            );

            // --------------------------------------------------------------------------------
            // 메인 렌더링
            // --------------------------------------------------------------------------------
            return (
                <div className={`flex h-screen overflow-hidden ${theme.bg} ${theme.text} ${font.class} transition-colors duration-300`}>
                    
                    {/* 이어보기 팝업 모달 */}
                    {showResumeModal && lastReadData && view === 'list' && (
                        <div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center pointer-events-none">
                            <div className="absolute inset-0 bg-black/40 pointer-events-auto transition-opacity" onClick={() => setShowResumeModal(false)}></div>
                            <div className={`
                                relative w-full sm:w-auto sm:max-w-md sm:rounded-2xl rounded-t-2xl shadow-2xl p-6 pointer-events-auto animate-slide-up
                                ${theme.bg} ${theme.text} border-t sm:border border-gray-500/20
                            `}>
                                <div className="flex items-start gap-4">
                                    <div className="p-3 rounded-full bg-blue-100 text-blue-600 shrink-0">
                                        <RotateCcw size={24} />
                                    </div>
                                    <div className="flex-1">
                                        <h3 className="text-lg font-bold mb-1">이어보시겠습니까?</h3>
                                        <p className="text-sm opacity-80 mb-3">마지막으로 읽던 기록이 있습니다.</p>
                                        <div className={`p-3 rounded-lg text-sm mb-4 border ${themeKey === 'dark' || themeKey === 'black' ? 'bg-white/5 border-white/10' : 'bg-black/5 border-black/10'}`}>
                                            <div className="font-bold opacity-90 truncate">{lastReadData.novelTitle}</div>
                                            <div className="opacity-70 truncate mt-1">{lastReadData.chapterTitle}</div>
                                        </div>
                                        <div className="flex gap-3">
                                            <button 
                                                onClick={() => setShowResumeModal(false)} 
                                                className={`flex-1 py-3 rounded-lg font-medium text-sm transition-colors ${themeKey === 'dark' || themeKey === 'black' ? 'bg-white/10 hover:bg-white/20' : 'bg-black/5 hover:bg-black/10'}`}
                                            >
                                                아니오
                                            </button>
                                            <button 
                                                onClick={handleResume} 
                                                className="flex-1 py-3 rounded-lg font-bold text-sm bg-blue-600 text-white hover:bg-blue-700 transition-colors shadow-lg shadow-blue-500/30"
                                            >
                                                네, 이어볼게요
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 사이드바 */}
                    {view === 'reader' && (
                        <>
                            {sidebarOpen && (
                                <div className="fixed inset-0 bg-black/50 z-40 md:hidden" onClick={() => setSidebarOpen(false)}></div>
                            )}

                            <div className={`
                                fixed md:relative inset-y-0 left-0 z-50 w-72 flex flex-col border-r shadow-xl md:shadow-none transition-all duration-300 ease-in-out
                                ${theme.ui} ${theme.text} border-gray-500/20
                                ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} 
                                ${desktopSidebarVisible ? 'md:translate-x-0 md:w-72' : 'md:w-0 md:overflow-hidden md:border-r-0'}
                            `}>
                                <div className="p-4 border-b border-gray-500/20 flex justify-between items-center h-16 shrink-0">
                                    <h2 className="font-bold text-lg flex items-center gap-2 truncate pr-2">
                                        <Book size={20} />
                                        <span className="truncate">{currentNovel?.title}</span>
                                    </h2>
                                    <button onClick={() => setSidebarOpen(false)} className="md:hidden p-1 rounded hover:bg-black/10">
                                        <XIcon size={20} />
                                    </button>
                                </div>
                                
                                <div className="p-2 border-b border-gray-500/20 shrink-0">
                                    <button onClick={() => setView('list')} className="w-full flex items-center gap-2 p-2 rounded hover:bg-black/5 text-sm font-bold opacity-70">
                                        <Home size={16} /> 서재로 돌아가기
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-2 w-full">
                                    {chapters.map((chapter, idx) => (
                                        <button
                                            key={chapter.id}
                                            onClick={() => setCurrentChapterIndex(idx)}
                                            className={`w-full text-left p-3 rounded-lg mb-1 transition-colors text-sm ${
                                                currentChapterIndex === idx ? theme.activeItem : 'hover:bg-black/5 opacity-80 hover:opacity-100'
                                            }`}
                                        >
                                            <span className="text-xs opacity-60 block mb-0.5">#{idx + 1}</span>
                                            <span className="block font-medium truncate">{chapter.title}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </>
                    )}

                    {/* 메인 콘텐츠 */}
                    <div className="flex-1 flex flex-col h-full relative min-w-0">
                        
                        {/* 헤더 */}
                        <header className={`h-16 flex items-center justify-between px-4 border-b border-black/10 sticky top-0 z-20 ${theme.ui}`}>
                            <div className="flex items-center gap-3 overflow-hidden">
                                {view === 'reader' && (
                                    <button onClick={toggleSidebar} className="p-2 rounded hover:bg-black/10 shrink-0">
                                        {/* 데스크탑에서는 접기/펴기 아이콘으로 인식되도록, 모바일은 햄버거 메뉴 */}
                                        <Menu size={20} />
                                    </button>
                                )}
                                <h1 className="font-bold text-lg truncate">
                                    {view === 'list' ? 'Jinos 웹소설' : (
                                        <span className="flex flex-col md:block">
                                            <span className="md:hidden text-xs opacity-70">{currentNovel?.title}</span>
                                            <span>{chapters[currentChapterIndex]?.title || currentNovel?.title}</span>
                                        </span>
                                    )}
                                </h1>
                            </div>
                            
                            <div className="flex items-center gap-1 shrink-0">
                                {/* 진행률 표시 (Reader 모드일 때만) */}
                                {view === 'reader' && (
                                    <div className="text-xs font-mono opacity-50 mr-2 min-w-[3ch] text-right" title="읽기 진행률">
                                        {scrollProgress}%
                                    </div>
                                )}
                                {view === 'list' && (
                                    <button onClick={() => setHelpOpen(true)} className="p-2 rounded-full hover:bg-black/5 text-gray-500">
                                        <HelpCircle size={20} />
                                    </button>
                                )}
                                <button onClick={() => setSettingsOpen(!settingsOpen)} className={`p-2 rounded-full transition-colors ${settingsOpen ? 'bg-black/10' : 'hover:bg-black/5'}`}>
                                    <Settings size={20} />
                                </button>
                            </div>

                            {/* 설정 팝업 */}
                            {settingsOpen && (
                                <div className={`absolute top-16 right-2 w-80 max-w-[95vw] p-5 rounded-xl shadow-2xl border ${theme.card} z-50 text-sm`}>
                                    <div className="space-y-5">
                                        {/* 테마 */}
                                        <div>
                                            <label className="text-xs font-bold opacity-60 mb-2 block uppercase">테마</label>
                                            <div className="grid grid-cols-5 gap-1 bg-black/5 p-1 rounded-lg">
                                                {Object.values(THEMES).map((t) => (
                                                    <button 
                                                        key={t.id} 
                                                        onClick={() => setThemeKey(t.id)} 
                                                        className={`h-8 rounded flex items-center justify-center ${themeKey === t.id ? 'ring-2 ring-blue-500 ring-offset-1' : 'hover:opacity-80'}`}
                                                        style={{ backgroundColor: t.id === 'light' ? '#fff' : t.id === 'sepia' ? '#f4ecd8' : t.id === 'green' ? '#e0f2f1' : t.id === 'dark' ? '#2a2a2a' : '#000' }}
                                                        title={t.name}
                                                    >
                                                        {themeKey === t.id && <div className="w-1.5 h-1.5 rounded-full bg-blue-500"></div>}
                                                    </button>
                                                ))}
                                            </div>
                                            <div className="text-center text-xs mt-1 opacity-60">{THEMES[themeKey].name} 모드</div>
                                        </div>

                                        {/* 폰트 종류 */}
                                        <div>
                                            <label className="text-xs font-bold opacity-60 mb-2 block uppercase">폰트 종류</label>
                                            <div className="grid grid-cols-3 gap-2">
                                                {Object.entries(FONTS).map(([key, f]) => (
                                                    <button
                                                        key={key}
                                                        onClick={() => setFontFamilyKey(key)}
                                                        className={`py-2 px-1 rounded border text-xs ${fontFamilyKey === key ? 'border-blue-500 bg-blue-50 text-blue-700 font-bold' : 'border-gray-300 opacity-70 hover:opacity-100'}`}
                                                    >
                                                        {f.name.split('(')[0]}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        {/* 글자 크기 */}
                                        <div>
                                            <label className="text-xs font-bold opacity-60 mb-2 block uppercase flex justify-between">
                                                <span>글자 크기</span>
                                                <span>{fontSize}px</span>
                                            </label>
                                            <input type="range" min="12" max="32" step="1" value={fontSize} onChange={(e) => setFontSize(Number(e.target.value))} className="w-full accent-blue-500 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" />
                                        </div>

                                        {/* 줄 간격 */}
                                        <div>
                                            <label className="text-xs font-bold opacity-60 mb-2 block uppercase">줄 간격</label>
                                            <div className="flex gap-2 bg-black/5 p-1 rounded-lg">
                                                {[1.4, 1.6, 1.8, 2.0, 2.4].map((lh) => (
                                                    <button key={lh} onClick={() => setLineHeight(lh)} className={`flex-1 py-1 rounded text-xs ${lineHeight === lh ? 'bg-white shadow text-black font-bold' : 'hover:bg-black/5 opacity-60'}`}>
                                                        {lh}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </header>

                        {/* 메인 영역 분기 (리스트 or 뷰어) */}
                        <main ref={viewerRef} className="flex-1 overflow-y-auto relative scroll-smooth no-scrollbar">
                            
                            {/* 1. 소설 목록 (카드) */}
                            {view === 'list' && (
                                <div className="max-w-6xl mx-auto p-4 md:p-8">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {novels.map((novel) => (
                                            <button 
                                                key={novel.id} 
                                                onClick={() => selectNovel(novel)}
                                                className={`group flex flex-col text-left rounded-xl overflow-hidden shadow-sm hover:shadow-xl transition-all transform hover:-translate-y-1 border ${theme.card}`}
                                            >
                                                <div className={`h-48 w-full ${themeKey === 'black' ? 'bg-gray-900' : 'bg-gray-200'} relative overflow-hidden flex items-center justify-center`}>
                                                    {novel.coverUrl ? (
                                                        <img src={novel.coverUrl} alt={novel.title} className="w-full h-full object-cover" />
                                                    ) : (
                                                        <img 
                                                            src={`./${novel.path}/cover.jpg`} 
                                                            alt={novel.title}
                                                            className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                                                            onError={(e) => {
                                                                const target = e.target;
                                                                // jpg 실패시 png 시도, 그것도 실패하면 숨김
                                                                if (target.src.endsWith('cover.jpg')) {
                                                                    target.src = `./${novel.path}/cover.png`;
                                                                } else {
                                                                    target.style.display = 'none';
                                                                    target.nextElementSibling.style.display = 'flex'; // 아이콘 표시
                                                                }
                                                            }}
                                                        />
                                                    )}
                                                    <div className={`hidden absolute inset-0 items-center justify-center ${themeKey === 'black' ? 'text-gray-700' : 'text-gray-400'}`}> 
                                                        <ImageIcon size={48} />
                                                    </div>
                                                </div>
                                                <div className="p-4 flex-1 flex flex-col justify-center">
                                                    <h3 className="font-bold text-lg mb-2 line-clamp-2">{novel.title}</h3>
                                                    <span className="text-sm opacity-60 flex items-center gap-1">
                                                        <Book size={14} /> 소설 읽기
                                                    </span>
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* 2. 텍스트 뷰어 */}
                            {view === 'reader' && (
                                <div className="max-w-3xl mx-auto px-5 py-8 md:py-16 min-h-full flex flex-col">
                                    {/* 챕터 제목 */}
                                    <div className="mb-10 pb-6 border-b border-black/10 text-center">
                                        <span className="text-xs font-bold opacity-50 mb-2 block uppercase tracking-wider">Episode {chapters.length > 0 && chapters[currentChapterIndex].id}</span>
                                        <h2 className="text-2xl md:text-3xl font-bold leading-tight">
                                            {chapters.length > 0 && chapters[currentChapterIndex].title}
                                        </h2>
                                    </div>

                                    {/* 본문 */}
                                    {isLoading ? (
                                        <div className="flex-1 flex justify-center items-center py-20">
                                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-current opacity-30"></div>
                                        </div>
                                    ) : (
                                        <div 
                                            className="prose max-w-none whitespace-pre-wrap outline-none text-justify"
                                            style={{ fontSize: `${fontSize}px`, lineHeight: lineHeight }}
                                        >
                                            {content}
                                        </div>
                                    )}
                                    
                                    {/* 하단 네비게이션 */}
                                    <div className="mt-20 pt-8 border-t border-black/10 flex justify-between items-center select-none">
                                        <button 
                                            onClick={handlePrev}
                                            disabled={currentChapterIndex === 0}
                                            className={`flex items-center gap-2 px-4 py-3 rounded-lg transition-colors ${currentChapterIndex === 0 ? 'opacity-30 cursor-not-allowed' : 'hover:bg-black/5 active:bg-black/10'}`}
                                        >
                                            <ChevronLeft size={20} />
                                            <span className="hidden sm:inline font-medium">이전 화</span>
                                        </button>
                                        
                                        <span className="text-sm opacity-60 font-mono">
                                            {currentChapterIndex + 1} / {chapters.length}
                                        </span>

                                        <button 
                                            onClick={handleNext}
                                            disabled={currentChapterIndex === chapters.length - 1}
                                            className={`flex items-center gap-2 px-4 py-3 rounded-lg transition-colors ${currentChapterIndex === chapters.length - 1 ? 'opacity-30 cursor-not-allowed' : 'hover:bg-black/5 active:bg-black/10'}`}
                                        >
                                            <span className="hidden sm:inline font-medium">다음 화</span>
                                            <ChevronRight size={20} />
                                        </button>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>

                    {/* 도움말 모달 */}
                    {helpOpen && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 p-4" onClick={() => setHelpOpen(false)}>
                            <div className={`max-w-md w-full p-6 rounded-xl shadow-2xl relative ${theme.bg} ${theme.text}`} onClick={e => e.stopPropagation()}>
                                <button onClick={() => setHelpOpen(false)} className="absolute top-4 right-4 opacity-50 hover:opacity-100"><XIcon size={24} /></button>
                                <h3 className="text-xl font-bold mb-4">Jinos 웹소설 가이드</h3>
                                <div className="space-y-4 text-sm opacity-80 leading-relaxed">
                                    <p>GitHub Repository에 소설 파일을 올리면 자동으로 이곳에 표시됩니다.</p>
                                    <ul className="list-disc pl-5 space-y-1">
                                        <li><strong>폴더 구조:</strong> Novels / 소설제목 / 파일들</li>
                                        <li><strong>파일 이름:</strong> 1.첫만남.txt 형태로 저장</li>
                                        <li><strong>이미지:</strong> 폴더 안에 cover.jpg 저장</li>
                                    </ul>
                                </div>
                                <div className="mt-6 text-center">
                                    <button onClick={() => setHelpOpen(false)} className="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">닫기</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WebNovelReader />);
    </script>
</body>
</html>
