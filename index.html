<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jinos 웹소설</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Markdown Parser -->
    <script src="https://unpkg.com/marked@4.3.0/marked.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        /* [보안 설정] 텍스트 선택 방지 */
        body { 
            margin: 0; 
            padding: 0; 
            touch-action: pan-y;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        .font-sans-kr { font-family: 'Noto Sans KR', sans-serif; }
        .font-serif-kr { font-family: 'Noto Serif KR', serif; }
        .font-dodum-kr { font-family: 'Gowun Dodum', sans-serif; }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }

        /* [커스텀 스크롤바] */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track, #f1f1f1); }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb, #888); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover, #555); }
        * { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track); }

        /* [마크다운 상세 스타일] */
        .markdown-body { color: inherit; line-height: inherit; }
        .markdown-body h1 { font-size: 1.8em; font-weight: 800; margin: 1.2em 0 0.6em; border-bottom: 2px solid currentColor; padding-bottom: 0.3em; }
        .markdown-body h2 { font-size: 1.5em; font-weight: 700; margin: 1em 0 0.5em; border-bottom: 1px solid currentColor; opacity: 0.9; padding-bottom: 0.2em; }
        .markdown-body h3 { font-size: 1.2em; font-weight: 700; margin: 0.8em 0 0.4em; }
        .markdown-body p { margin-bottom: 1.2em; text-align: justify; }
        .markdown-body blockquote { border-left: 4px solid #888; padding: 0.5em 1em; opacity: 0.8; font-style: italic; margin: 1.5em 0; background: rgba(0,0,0,0.03); }
        .markdown-body hr { border: 0; border-top: 1px solid currentColor; opacity: 0.2; margin: 2em 0; }
        .markdown-body img { max-width: 100%; height: auto; border-radius: 8px; margin: 1em auto; display: block; }

        /* 알림 토스트 */
        .toast {
            position: fixed;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.75rem 1.5rem;
            background: rgba(0,0,0,0.85);
            color: white;
            border-radius: 9999px;
            z-index: 2000;
            font-size: 0.875rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, memo, useCallback } = React;

        // ----------------------------------------------------------------------
        // [1. 설정 및 상수]
        // ----------------------------------------------------------------------
        const GITHUB_CONFIG = {
            owner: "jinhoSung",
            repo: "JNSWebNovel",
            rootPath: "Novels",
            branch: "main",
        };

        const ADMIN_PASSWORD = "admin123";

        const THEMES = {
            light: { id: 'light', bg: 'bg-white', text: 'text-gray-900', ui: 'bg-gray-50', card: 'bg-white border-gray-200', activeItem: 'bg-blue-100 text-blue-700', scrollbarThumb: '#cbd5e1', scrollbarTrack: '#f1f5f9' },
            sepia: { id: 'sepia', bg: 'bg-[#f4ecd8]', text: 'text-[#5b4636]', ui: 'bg-[#e9dfc6]', card: 'bg-[#fdf6e3] border-[#d3c5a3]', activeItem: 'bg-[#d3c5a3] text-[#4a3b2a]', scrollbarThumb: '#d3c5a3', scrollbarTrack: '#f4ecd8' },
            dark: { id: 'dark', bg: 'bg-[#1a1a1a]', text: 'text-gray-300', ui: 'bg-[#2a2a2a]', card: 'bg-[#333] border-gray-700', activeItem: 'bg-[#404040] text-blue-300', scrollbarThumb: '#4b5563', scrollbarTrack: '#1a1a1a' },
            black: { id: 'black', bg: 'bg-black', text: 'text-gray-400', ui: 'bg-[#111]', card: 'bg-[#111] border-gray-800', activeItem: 'bg-[#222] text-white', scrollbarThumb: '#333', scrollbarTrack: '#000' },
        };

        const FONTS = {
            sans: { name: '고딕(Sans)', class: 'font-sans-kr' },
            serif: { name: '명조(Serif)', class: 'font-serif-kr' },
            dodum: { name: '돋움(Dodum)', class: 'font-dodum-kr' },
        };

        // ----------------------------------------------------------------------
        // [2. 커스텀 훅] LocalStorage
        // ----------------------------------------------------------------------
        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) { return initialValue; }
            });
            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {}
            };
            return [storedValue, setValue];
        }

        // ----------------------------------------------------------------------
        // [3. 아이콘 컴포넌트]
        // ----------------------------------------------------------------------
        const Icon = ({ path, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );

        const Book = (props) => <Icon {...props} path={<><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></>} />;
        const ChevronLeft = (props) => <Icon {...props} path={<path d="m15 18-6-6 6-6"/>} />;
        const ChevronRight = (props) => <Icon {...props} path={<path d="m9 18 6-6-6-6"/>} />;
        const Menu = (props) => <Icon {...props} path={<><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></>} />;
        const Settings = (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></>} />;
        const XIcon = (props) => <Icon {...props} path={<><path d="M18 6 6 18"/><path d="M6 6l12 12"/></>} />;
        const Home = (props) => <Icon {...props} path={<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>} />;
        const ImageIcon = (props) => <Icon {...props} path={<><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></>} />;
        const Copy = (props) => <Icon {...props} path={<><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></>} />;
        const LinkIcon = (props) => <Icon {...props} path={<><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></>} />;
        const Maximize = (props) => <Icon {...props} path={<><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></>} />;
        const Minimize = (props) => <Icon {...props} path={<><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></>} />;
        const MousePointerClick = (props) => <Icon {...props} path={<><path d="m9 9 5 12 1.8-5.2L21 14Z"/><path d="M7.2 2.2 8 5.1"/><path d="m5.1 8-2.9-.8"/><path d="M14 4.1 12 6"/><path d="m6 12-1.9 2"/></>} />;

        // ----------------------------------------------------------------------
        // [4. 시계 컴포넌트]
        // ----------------------------------------------------------------------
        const CurrentTimeDisplay = memo(() => {
            const [time, setTime] = useState("");
            useEffect(() => {
                const update = () => {
                    const now = new Date();
                    const month = now.getMonth() + 1;
                    const day = now.getDate();
                    const h = String(now.getHours()).padStart(2, '0');
                    const m = String(now.getMinutes()).padStart(2, '0');
                    const s = String(now.getSeconds()).padStart(2, '0');
                    setTime(window.innerWidth < 640 ? `${h}:${m}:${s}` : `${month}월 ${day}일 ${h}:${m}:${s}`);
                };
                update();
                const timer = setInterval(update, 1000);
                return () => clearInterval(timer);
            }, []);
            return <div className="text-sm font-bold opacity-70 mr-3 tabular-nums select-none">{time}</div>;
        });

        // ----------------------------------------------------------------------
        // [5. 메인 앱 컴포넌트]
        // ----------------------------------------------------------------------
        function App() {
            const [view, setView] = useState('list');
            const [novels, setNovels] = useState([]);
            const [currentNovel, setCurrentNovel] = useState(null);
            const [chapters, setChapters] = useState([]);
            const [currentChapterIndex, setCurrentChapterIndex] = useState(0);
            const [content, setContent] = useState("");
            const [isLoading, setIsLoading] = useState(false);
            const [isGlobalLoading, setIsGlobalLoading] = useState(true);
            const [errorMsg, setErrorMsg] = useState(null);
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [desktopSidebarVisible, setDesktopSidebarVisible] = useState(true);
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [isFullScreen, setIsFullScreen] = useState(false);
            const [scrollProgress, setScrollProgress] = useState(0);
            const [toastMsg, setToastMsg] = useState("");
            const [adminPwInput, setAdminPwInput] = useState("");
            const [lastReadData, setLastReadData] = useState(null);
            const [showResumeModal, setShowResumeModal] = useState(false);

            const [themeKey, setThemeKey] = useLocalStorage('jinos_theme', 'sepia');
            const [fontSize, setFontSize] = useLocalStorage('jinos_fontsize', 18);
            const [lineHeight, setLineHeight] = useLocalStorage('jinos_lineheight', 1.8);
            const [fontFamilyKey, setFontFamilyKey] = useLocalStorage('jinos_font', 'sans');
            const [gestureEnabled, setGestureEnabled] = useLocalStorage('jinos_gesture', true);
            const [isAdmin, setIsAdmin] = useLocalStorage('jinos_admin', false);

            const viewerRef = useRef(null);
            const saveTimeoutRef = useRef(null);
            const copyAreaRef = useRef(null);
            const dragStartRef = useRef({ x: 0, y: 0 });

            const theme = THEMES[themeKey] || THEMES.sepia;
            const font = FONTS[fontFamilyKey] || FONTS.sans;
            const isPreviewEnv = window.location.protocol === 'blob:' || window.location.hostname === '';

            const showToast = useCallback((msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(""), 2000);
            }, []);

            // [기능: 마크다운 텍스트 변환기]
            const convertMarkdownToPlainText = (md) => {
                if (!window.marked) return md;
                try {
                    const html = window.marked.parse(md);
                    const tempDiv = document.createElement("div");
                    tempDiv.setAttribute('style', 'display: block; white-space: pre-wrap; width: 1000px; position: absolute; left: -9999px;');
                    tempDiv.innerHTML = html;
                    
                    tempDiv.querySelectorAll('hr').forEach(hr => hr.replaceWith(document.createTextNode("\n--------------------------------------------------\n")));
                    tempDiv.querySelectorAll('blockquote').forEach(bq => {
                        bq.innerText = bq.innerText.split('\n').map(l => l.trim() ? `> ${l}` : `>`).join('\n');
                    });

                    document.body.appendChild(tempDiv);
                    const result = tempDiv.innerText;
                    document.body.removeChild(tempDiv);
                    return result;
                } catch (e) { return md; }
            };

            // [기능: 텍스트 클립보드 복사]
            const copyToClipboard = (text, successMsg = "텍스트가 복사되었습니다.") => {
                try {
                    const el = copyAreaRef.current;
                    el.value = text;
                    el.select();
                    document.execCommand('copy');
                    showToast(successMsg);
                } catch (err) { showToast("복사 실패"); }
            };

            // [기능: 현재 URL 링크 복사]
            const handleCopyLink = () => {
                const url = window.location.href;
                copyToClipboard(url, "현재 위치의 링크가 복사되었습니다.");
            };

            // [기능: 회차 목록 즉시 복사 (관리자)]
            const handleQuickCopy = async (e, chapter) => {
                e.stopPropagation();
                if (!isAdmin) return;
                showToast(`${chapter.id}화 변환 중...`);
                try {
                    const response = await fetch(chapter.downloadUrl);
                    if (!response.ok) throw new Error();
                    const rawMd = await response.text();
                    copyToClipboard(convertMarkdownToPlainText(rawMd), "본문 내용이 클립보드에 복사되었습니다.");
                } catch (err) { showToast("로드 실패"); }
            };

            // [기능: 이어보기 저장 로직]
            const saveProgress = useCallback(() => {
                if (view !== 'reader' || !currentNovel || !chapters[currentChapterIndex]) return;

                let ratio = 0;
                if (viewerRef.current) {
                    const { scrollTop, scrollHeight, clientHeight } = viewerRef.current;
                    const total = scrollHeight - clientHeight;
                    if (total > 0) ratio = scrollTop / total;
                }

                const data = {
                    novelId: currentNovel.id,
                    novelTitle: currentNovel.title,
                    novelPath: currentNovel.path,
                    chapterIndex: currentChapterIndex,
                    chapterTitle: chapters[currentChapterIndex].title,
                    scrollRatio: ratio,
                    timestamp: Date.now()
                };

                localStorage.setItem('jinos_last_read', JSON.stringify(data));
                setLastReadData(data);
            }, [view, currentNovel, chapters, currentChapterIndex]);

            // [데이터 로드: 초기 라우팅 및 소설 리스트]
            useEffect(() => {
                const initializeApp = async () => {
                    setIsGlobalLoading(true);
                    setErrorMsg(null);
                    let fetchedNovels = [];
                    
                    try {
                        if (isPreviewEnv) {
                            fetchedNovels = [{ id: '1', title: "테스트 소설", path: "test" }];
                        } else {
                            const response = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.rootPath}`);
                            if (!response.ok) throw new Error("서재 정보를 가져올 수 없습니다.");
                            const data = await response.json();
                            if (Array.isArray(data)) {
                                fetchedNovels = data.filter(i => i.type === 'dir').map(f => ({ 
                                    id: f.sha, 
                                    title: decodeURIComponent(f.name).replace(/[-_]/g, ' '), 
                                    path: f.path 
                                }));
                            }
                        }
                        setNovels(fetchedNovels);

                        // URL 라우팅 분석
                        const urlParams = new URLSearchParams(window.location.search);
                        const queryNovelPath = urlParams.get('novel');
                        const hasChapterQuery = urlParams.has('chapter');
                        const queryChapter = parseInt(urlParams.get('chapter') || '0', 10);

                        if (queryNovelPath) {
                            const targetNovel = fetchedNovels.find(n => n.path === queryNovelPath);
                            if (targetNovel) {
                                if (hasChapterQuery) {
                                    // URL에 회차가 지정되어 있으면 즉시 해당 회차(인덱스)로 이동
                                    selectNovel(targetNovel, queryChapter, 0);
                                } else {
                                    // URL에 회차가 없으면 이어보기 데이터 검사
                                    const saved = localStorage.getItem('jinos_last_read');
                                    let targetIdx = 0;
                                    let targetRatio = 0;
                                    if (saved) {
                                        const parsed = JSON.parse(saved);
                                        if (parsed && parsed.novelPath === queryNovelPath) {
                                            targetIdx = parsed.chapterIndex || 0;
                                            targetRatio = parsed.scrollRatio || 0;
                                        }
                                    }
                                    selectNovel(targetNovel, targetIdx, targetRatio);
                                }
                                return; // URL로 진입 시 이어보기 모달창 스킵
                            }
                        }

                        // 일반 진입 시 로컬 스토리지 이어보기 모달 체크
                        const savedRead = localStorage.getItem('jinos_last_read');
                        if (savedRead) {
                            const parsed = JSON.parse(savedRead);
                            if (parsed && parsed.novelId) { setLastReadData(parsed); setShowResumeModal(true); }
                        }

                    } catch (err) { setErrorMsg("서재 목록을 로드하지 못했습니다."); } 
                    finally { setIsGlobalLoading(false); }
                };

                initializeApp();
            }, []);

            // https://play.google.com/store/apps/details?id=com.devforplayapp.livemobilelocation&hl=ko
            useEffect(() => {
                if (isPreviewEnv) return;
                try {
                    if (view === 'reader' && currentNovel) {
                        const newUrl = `${window.location.pathname}?novel=${encodeURIComponent(currentNovel.path)}&chapter=${currentChapterIndex}`;
                        window.history.replaceState(null, '', newUrl);
                    } else if (view === 'list') {
                        window.history.replaceState(null, '', window.location.pathname);
                    }
                } catch (e) { /* iframe 내 보안 예외 처리 */ }
            }, [view, currentNovel, currentChapterIndex, isPreviewEnv]);

            const selectNovel = async (novel, targetIndex = 0, targetRatio = 0) => {
                setCurrentNovel(novel); setView('reader'); setChapters([]); setContent(""); setIsLoading(true);
                setSidebarOpen(false); setDesktopSidebarVisible(true); setScrollProgress(0);
                
                if (viewerRef.current) viewerRef.current.dataset.restore = targetRatio;

                try {
                    if (isPreviewEnv) {
                        setChapters([{ id: 1, title: "1. 시작", downloadUrl: "", fileName: "1.txt" }]);
                        setCurrentChapterIndex(targetIndex);
                    } else {
                        const response = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${novel.path}`);
                        if (!response.ok) throw new Error();
                        const data = await response.json();
                        const loaded = data.filter(f => f.name.endsWith('.txt') || f.name.endsWith('.md')).map(file => {
                            let rawName = file.name.replace(/\.(txt|md)$/i, '').replace(/\[.*?\]/g, '').trim();
                            const numMatch = rawName.match(/(\d+)/);
                            const chapterNum = numMatch ? parseInt(numMatch[0]) : 0;
                            let titlePart = numMatch ? rawName.replace(numMatch[0], '').replace(/^[.\s_\[\]\(\)화장제-]+|[.\s_\[\]\(\)화장제-]+$/g, '').trim() : rawName;
                            return { id: chapterNum, title: `제${chapterNum}화 - ${titlePart || "제목 없음"}`, downloadUrl: file.download_url, fileName: file.name };
                        }).sort((a, b) => a.id - b.id);
                        setChapters(loaded);
                        
                        // 타겟 인덱스 방어 로직
                        const finalIndex = (targetIndex >= 0 && targetIndex < loaded.length) ? targetIndex : 0;
                        setCurrentChapterIndex(finalIndex);
                    }
                } catch (error) { showToast("목록을 불러오지 못했습니다."); } 
                finally { setIsLoading(false); }
            };

            // [데이터 로드: 챕터 본문]
            useEffect(() => {
                if (view !== 'reader' || !chapters[currentChapterIndex]) return;
                setIsLoading(true);
                const fetchContent = async () => {
                    try {
                        if (isPreviewEnv) { setContent("# 미리보기 내용"); }
                        else {
                            const res = await fetch(chapters[currentChapterIndex].downloadUrl);
                            if (!res.ok) throw new Error();
                            setContent(await res.text());
                        }
                    } catch (e) { setContent("본문 로드 실패"); } 
                    finally {
                        setIsLoading(false);
                        requestAnimationFrame(() => {
                            requestAnimationFrame(() => {
                                if (viewerRef.current) {
                                    const ratio = parseFloat(viewerRef.current.dataset.restore || 0);
                                    if (ratio > 0) {
                                        const { scrollHeight, clientHeight } = viewerRef.current;
                                        viewerRef.current.scrollTop = (scrollHeight - clientHeight) * ratio;
                                        viewerRef.current.dataset.restore = 0;
                                    } else {
                                        viewerRef.current.scrollTop = 0;
                                    }
                                }
                            });
                        });
                    }
                };
                fetchContent();
            }, [currentChapterIndex, chapters, view, isPreviewEnv]);

            // [이벤트: 스크롤 감지 및 자동 저장]
            useEffect(() => {
                const handleBeforeUnload = () => saveProgress();
                window.addEventListener('beforeunload', handleBeforeUnload);

                const handleScroll = () => {
                    if (viewerRef.current) {
                        const { scrollTop, scrollHeight, clientHeight } = viewerRef.current;
                        const total = scrollHeight - clientHeight;
                        setScrollProgress(total > 0 ? Math.min(100, Math.max(0, Math.round((scrollTop / total) * 100))) : 100);
                        
                        clearTimeout(saveTimeoutRef.current);
                        saveTimeoutRef.current = setTimeout(saveProgress, 300);
                    }
                };
                const el = viewerRef.current;
                if (el) el.addEventListener('scroll', handleScroll);
                return () => {
                    window.removeEventListener('beforeunload', handleBeforeUnload);
                    if (el) el.removeEventListener('scroll', handleScroll);
                    clearTimeout(saveTimeoutRef.current);
                };
            }, [content, view, saveProgress]);

            // [보안 설정]
            useEffect(() => {
                const preventDefault = (e) => { if (!isAdmin) e.preventDefault(); };
                document.addEventListener('contextmenu', preventDefault);
                document.addEventListener('copy', preventDefault);
                document.addEventListener('cut', preventDefault);
                document.addEventListener('paste', preventDefault);
                document.addEventListener('dragstart', preventDefault);
                document.addEventListener('selectstart', preventDefault);
                
                const handleKeyDown = (e) => {
                    if (e.key === 'F12' || (e.ctrlKey && 'usp'.includes(e.key.toLowerCase())) || (e.ctrlKey && e.shiftKey && 'ic'.includes(e.key.toLowerCase()))) {
                        if (!isAdmin) e.preventDefault();
                    }
                };
                document.addEventListener('keydown', handleKeyDown);
                const handleFullScreenChange = () => setIsFullScreen(!!document.fullscreenElement);
                document.addEventListener('fullscreenchange', handleFullScreenChange);

                return () => {
                    document.removeEventListener('contextmenu', preventDefault);
                    document.removeEventListener('copy', preventDefault);
                    document.removeEventListener('cut', preventDefault);
                    document.removeEventListener('paste', preventDefault);
                    document.removeEventListener('dragstart', preventDefault);
                    document.removeEventListener('selectstart', preventDefault);
                    document.removeEventListener('keydown', handleKeyDown);
                    document.removeEventListener('fullscreenchange', handleFullScreenChange);
                };
            }, [isAdmin]);

            // [기타 UI 핸들러]
            const handleAdminAuth = () => {
                if (adminPwInput === ADMIN_PASSWORD) { setIsAdmin(true); setAdminPwInput(""); showToast("관리자 인증 성공"); }
                else showToast("인증 실패");
            };
            const handlePrev = () => { saveProgress(); if (currentChapterIndex > 0) setCurrentChapterIndex(c => c - 1); };
            const handleNext = () => { saveProgress(); if (currentChapterIndex < chapters.length - 1) setCurrentChapterIndex(c => c + 1); };
            const toggleSidebar = () => { if (window.innerWidth >= 768) setDesktopSidebarVisible(!desktopSidebarVisible); else setSidebarOpen(!sidebarOpen); };
            const toggleFullScreen = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); };
            const handleDoubleClick = (e) => { if (!gestureEnabled) return; const w = window.innerWidth; if (e.clientX < w / 2) handlePrev(); else handleNext(); };
            const handlePointerDown = (e) => { if (!gestureEnabled) return; dragStartRef.current = { x: e.clientX || (e.touches && e.touches[0].clientX), y: e.clientY || (e.touches && e.touches[0].clientY) }; };
            const handlePointerUp = (e) => {
                if (!gestureEnabled || (!isAdmin && window.getSelection().toString().length > 0)) return;
                const x = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
                const y = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);
                const dX = x - dragStartRef.current.x, dY = y - dragStartRef.current.y;
                if (Math.abs(dY) < Math.abs(dX) && Math.abs(dY) <= 30 && Math.abs(dX) > 50) {
                    if (dX > 0) handlePrev(); else handleNext();
                }
            };

            const renderNovelBody = () => {
                const isMD = chapters[currentChapterIndex]?.fileName.endsWith('.md');
                if (isMD && window.marked) {
                    try { return <div className="markdown-body" dangerouslySetInnerHTML={{ __html: window.marked.parse(content) }} />; }
                    catch (e) {}
                }
                return <div className="prose whitespace-pre-wrap">{content}</div>;
            };

            if (isGlobalLoading) return <div className={`flex h-screen items-center justify-center ${theme.bg} ${theme.text}`}><div className="animate-spin rounded-full h-12 w-12 border-b-2 border-current"></div></div>;

            if (errorMsg) return (
                <div className={`flex h-screen flex-col items-center justify-center p-4 ${theme.bg} ${theme.text}`}>
                    <div className="max-w-md w-full p-6 border border-red-300 rounded-lg bg-red-50 text-red-700 shadow-lg text-center font-sans-kr">
                        <h3 className="font-bold text-lg mb-2">연결 오류</h3>
                        <p className="mb-4 text-sm">{errorMsg}</p>
                        <button onClick={() => window.location.reload()} className="px-6 py-2 bg-red-600 text-white rounded font-bold">새로고침</button>
                    </div>
                </div>
            );

            return (
                <div className={`flex h-screen overflow-hidden ${theme.bg} ${theme.text} ${font.class} transition-colors duration-300`}
                    style={{ '--scrollbar-thumb': theme.scrollbarThumb, '--scrollbar-track': theme.scrollbarTrack }}>
                    
                    <div className={`toast ${toastMsg ? 'show' : ''}`}>{toastMsg}</div>
                    <textarea ref={copyAreaRef} className="fixed -top-full -left-full opacity-0" readOnly />

                    {showResumeModal && lastReadData && view === 'list' && (
                        <div className="fixed inset-0 z-[150] flex items-end sm:items-center justify-center p-4 bg-black/40" onClick={() => setShowResumeModal(false)}>
                            <div className={`w-full max-w-md p-6 rounded-2xl animate-slide-up ${theme.bg} ${theme.text} border border-gray-500/10 shadow-2xl`} onClick={e => e.stopPropagation()}>
                                <h3 className="text-lg font-bold mb-2 font-sans-kr">읽던 소설이 있습니다</h3>
                                <p className="mb-6 opacity-70 text-sm">{lastReadData.novelTitle} - {lastReadData.chapterTitle}</p>
                                <div className="flex gap-2 font-sans-kr">
                                    <button onClick={() => setShowResumeModal(false)} className="flex-1 py-3 rounded-lg bg-black/5 font-bold">아니오</button>
                                    <button onClick={() => { setShowResumeModal(false); selectNovel({id:lastReadData.novelId, title:lastReadData.novelTitle, path:lastReadData.novelPath}, lastReadData.chapterIndex, lastReadData.scrollRatio); }} className="flex-1 py-3 rounded-lg bg-blue-600 text-white font-bold shadow-md">이어보기</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'reader' && (
                        <>
                            {sidebarOpen && <div className="fixed inset-0 bg-black/50 z-[90] md:hidden" onClick={() => setSidebarOpen(false)}></div>}
                            <div className={`fixed md:relative inset-y-0 left-0 z-[100] w-72 flex flex-col border-r transition-all duration-300 ${theme.ui} ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} ${desktopSidebarVisible ? 'md:translate-x-0 md:w-72' : 'md:w-0 md:overflow-hidden md:border-r-0'}`}>
                                <div className="p-4 border-b flex justify-between items-center h-16 shrink-0 font-bold"><span className="truncate">{currentNovel?.title}</span><button onClick={() => setSidebarOpen(false)} className="md:hidden"><XIcon size={20}/></button></div>
                                <button onClick={() => { saveProgress(); setView('list'); }} className="p-4 flex items-center gap-2 border-b opacity-70 text-sm font-bold hover:bg-black/5"><Home size={16}/> 서재로 돌아가기</button>
                                <div className="flex-1 overflow-y-auto p-2">
                                    {chapters.map((c, i) => (
                                        <div key={i} className="relative group">
                                            <button onClick={() => { saveProgress(); setCurrentChapterIndex(i); }} className={`w-full text-left p-3 pr-10 rounded-lg mb-1 text-sm ${currentChapterIndex === i ? theme.activeItem : 'hover:bg-black/5 opacity-80'}`}>
                                                <span className="text-xs opacity-50 block mb-0.5">#{i + 1}</span><span className="truncate block font-medium">{c.title}</span>
                                            </button>
                                            {isAdmin && (
                                                <button onClick={(e) => handleQuickCopy(e, c)} className="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-blue-500 opacity-0 group-hover:opacity-100 transition-all hover:bg-blue-500 hover:text-white rounded-full" title="변환 복사">
                                                    <Copy size={16} />
                                                </button>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </>
                    )}

                    <div className="flex-1 flex flex-col h-full min-w-0">
                        <header className={`h-16 flex items-center justify-between px-4 border-b sticky top-0 z-20 ${theme.ui}`}>
                            <div className="flex items-center gap-3 overflow-hidden">
                                {view === 'reader' && <button onClick={() => window.innerWidth < 768 ? setSidebarOpen(true) : setDesktopSidebarVisible(!desktopSidebarVisible)} className="p-2 rounded hover:bg-black/10 shrink-0"><Menu size={20}/></button>}
                                <h1 className="font-bold text-lg truncate font-sans-kr">{view === 'list' ? '나의 서재' : chapters[currentChapterIndex]?.title}</h1>
                            </div>
                            <div className="flex items-center gap-1 shrink-0">
                                <CurrentTimeDisplay />
                                {view === 'reader' && (
                                    <>
                                        <div className="text-xs font-mono opacity-50 mr-2">{scrollProgress}%</div>
                                        <button onClick={handleCopyLink} className="p-2 rounded-full hover:bg-black/5 text-gray-500" title="링크 복사"><LinkIcon size={20}/></button>
                                        {isAdmin && <button onClick={() => copyToClipboard(convertMarkdownToPlainText(content), "본문 텍스트가 복사되었습니다.")} className="p-2 rounded-full hover:bg-black/5 text-blue-600" title="본문 복사"><Copy size={20}/></button>}
                                    </>
                                )}
                                <button onClick={toggleFullScreen} className="p-2 rounded-full hover:bg-black/5 text-gray-500"><Maximize size={20}/></button>
                                <button onClick={() => setSettingsOpen(!settingsOpen)} className={`p-2 rounded-full transition-colors ${settingsOpen ? 'bg-black/10' : 'hover:bg-black/5'}`}><Settings size={20}/></button>
                            </div>

                            {settingsOpen && (
                                <div className={`absolute top-16 right-2 w-80 p-5 rounded-xl shadow-2xl border z-[200] text-sm ${theme.card}`}>
                                    <div className="space-y-5 font-sans-kr">
                                        <div><label className="text-xs font-bold opacity-60 mb-2 block uppercase">테마</label>
                                            <div className="grid grid-cols-5 gap-1 p-1 rounded-lg bg-black/5">
                                                {Object.values(THEMES).map(t => (<button key={t.id} onClick={() => setThemeKey(t.id)} className={`h-8 rounded flex items-center justify-center ${themeKey === t.id ? 'ring-2 ring-blue-500' : ''}`} style={{background: t.id === 'black' ? '#000' : (t.id === 'sepia' ? '#f4ecd8' : (t.id === 'dark' ? '#1a1a1a' : (t.id === 'green' ? '#e0f2f1' : '#fff')))}}></button>))}
                                            </div>
                                        </div>
                                        <div><label className="text-xs font-bold opacity-60 mb-2 block uppercase">폰트 종류</label>
                                            <div className="grid grid-cols-3 gap-2">
                                                {Object.entries(FONTS).map(([k, v]) => (<button key={k} onClick={() => setFontFamilyKey(k)} className={`py-2 rounded border text-xs ${fontFamilyKey === k ? 'border-blue-500 text-blue-700 font-bold bg-blue-50' : 'border-gray-300 opacity-70 hover:opacity-100'}`}>{v.name.split('(')[0]}</button>))}
                                            </div>
                                        </div>
                                        <div><label className="text-xs font-bold opacity-60 mb-2 flex justify-between uppercase"><span>글자 크기</span><span>{fontSize}px</span></label>
                                            <input type="range" min="14" max="32" value={fontSize} onChange={e => setFontSize(Number(e.target.value))} className="w-full accent-blue-500 cursor-pointer" />
                                        </div>
                                        <div><label className="text-xs font-bold opacity-60 mb-2 block uppercase">줄 간격</label>
                                            <div className="flex gap-2 p-1 rounded-lg bg-black/5">
                                                {[1.4, 1.8, 2.4].map(lh => <button key={lh} onClick={() => setLineHeight(lh)} className={`flex-1 py-1 rounded text-xs ${lineHeight === lh ? 'bg-white shadow text-black font-bold' : 'hover:bg-black/5 opacity-50'}`}>{lh}</button>)}
                                            </div>
                                        </div>
                                        <div className="pt-2 border-t flex items-center justify-between">
                                            <div className="flex items-center gap-2"><MousePointerClick size={16} className="opacity-60"/><span className="font-bold opacity-80">제스처 이동</span></div>
                                            <input type="checkbox" checked={gestureEnabled} onChange={e => setGestureEnabled(e.target.checked)} className="toggle-checkbox h-5 w-10 cursor-pointer"/>
                                        </div>
                                        <div className="pt-2 border-t">
                                            <label className="text-xs font-bold opacity-60 mb-2 block">관리자 모드 (추출 전용)</label>
                                            {isAdmin ? (
                                                <div className="flex items-center justify-between bg-blue-50 p-2 rounded border border-blue-200">
                                                    <span className="text-blue-700 text-xs font-bold">인증 완료</span>
                                                    <button onClick={() => setIsAdmin(false)} className="text-[10px] text-red-500 underline font-bold">해제</button>
                                                </div>
                                            ) : (
                                                <div className="flex gap-1">
                                                    <input type="password" value={adminPwInput} onChange={e => setAdminPwInput(e.target.value)} placeholder="암호" className="flex-1 p-2 rounded border border-gray-300 text-xs text-black" />
                                                    <button onClick={handleAdminAuth} className="bg-gray-800 text-white px-3 py-1 rounded text-xs hover:bg-black font-bold">인증</button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </header>

                        <main ref={viewerRef} className="flex-1 overflow-y-auto relative scroll-smooth" onDoubleClick={handleDoubleClick} onMouseDown={handlePointerDown} onMouseUp={handlePointerUp} onTouchStart={handlePointerDown} onTouchEnd={handlePointerUp}>
                            {view === 'list' ? (
                                <div className="max-w-6xl mx-auto p-4 md:p-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {novels.map(n => (
                                        <button key={n.id} onClick={() => selectNovel(n)} className={`group flex flex-col text-left rounded-xl overflow-hidden shadow-sm border ${theme.card} transition-transform hover:-translate-y-1`}>
                                            <div className="h-48 w-full bg-gray-200 relative flex items-center justify-center overflow-hidden">
                                                <img src={`./${encodeURI(n.path)}/cover.jpg`} className="w-full h-full object-cover transition-transform group-hover:scale-105" onError={e => {
                                                    const b = `./${encodeURI(n.path)}/`;
                                                    if (e.target.src.endsWith('.jpg')) e.target.src = b + 'cover.png';
                                                    else if (e.target.src.endsWith('.png')) e.target.src = b + 'cover.jpeg';
                                                    else e.target.style.display = 'none';
                                                }}/>
                                                <ImageIcon size={48} className="absolute opacity-20"/>
                                            </div>
                                            <div className="p-4 flex-1 flex flex-col justify-center"><h3 className="font-bold text-lg mb-1 line-clamp-2">{n.title}</h3><span className="text-sm opacity-60 flex items-center gap-1"><Book size={14}/>소설 읽기</span></div>
                                        </button>
                                    ))}
                                </div>
                            ) : (
                                <div className="max-w-3xl mx-auto px-5 py-8 md:py-16 min-h-full flex flex-col">
                                    <div className="mb-10 pb-6 border-b text-center border-black/10">
                                        <h2 className="text-2xl md:text-3xl font-bold leading-tight">{chapters[currentChapterIndex]?.title}</h2>
                                    </div>
                                    {isLoading ? (
                                        <div className="flex-1 flex justify-center py-20 animate-pulse font-bold opacity-50 text-sm">본문 로딩 중...</div>
                                    ) : (
                                        <div className="outline-none" style={{ fontSize: `${fontSize}px`, lineHeight: lineHeight }}>
                                            {renderNovelBody()}
                                        </div>
                                    )}
                                    <div className="mt-20 pt-8 border-t border-black/10 flex justify-between items-center select-none font-sans-kr">
                                        <button onClick={handlePrev} disabled={currentChapterIndex === 0} className={`p-2 px-4 rounded-lg transition-colors flex items-center gap-2 ${currentChapterIndex === 0 ? 'opacity-20 cursor-not-allowed' : 'hover:bg-black/5 active:bg-black/10'}`}>
                                            <ChevronLeft size={20}/><span>이전 화</span>
                                        </button>
                                        <span className="font-mono text-sm opacity-60 font-bold">{currentChapterIndex + 1} / {chapters.length}</span>
                                        <button onClick={handleNext} disabled={currentChapterIndex === chapters.length - 1} className={`p-2 px-4 rounded-lg transition-colors flex items-center gap-2 ${currentChapterIndex === chapters.length - 1 ? 'opacity-20 cursor-not-allowed' : 'hover:bg-black/5 active:bg-black/10'}`}>
                                            <span>다음 화</span><ChevronRight size={20}/>
                                        </button>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
